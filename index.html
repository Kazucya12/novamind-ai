<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaMind</title>
<style>
:root{--bg:#0b0d12;--card:#14171e;--card2:#1b1f29;--line:#272c38;--tx:#e8eaf0;--mut:#8b92a5;--pri:#8b7cf6;--err:#ff6b6b;--grad:linear-gradient(135deg,#8b7cf6,#e8873f)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}

/* AUTH */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px}
.logo{width:64px;height:64px;border-radius:20px;background:var(--grad);display:grid;place-items:center;margin:0 auto 14px;font-size:28px;color:#0b0d12}
.box h1{text-align:center;font-size:22px}
.box .sub{text-align:center;color:var(--mut);font-size:13px;margin:6px 0 18px}
.tabs{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:0;background:none;border-radius:10px;color:var(--mut);font-weight:600;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--pri)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.inp{width:100%;padding:13px 14px;background:var(--card2);border:1px solid var(--line);border-radius:12px;outline:none}
.inp:focus{border-color:var(--pri)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:8px;cursor:pointer;font-size:16px}
.rem{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:14px;color:var(--mut)}
#msg{min-height:22px;text-align:center;font-size:14px;margin:10px 0;color:var(--err)}
#msg.ok{color:#5fd38d}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:var(--grad);color:#0b0d12;font-weight:700;font-size:16px;cursor:pointer}
.go:disabled{opacity:.6}
.note{text-align:center;color:var(--mut);font-size:12px;margin-top:14px}

/* APP */
#app{height:100%;display:flex}
#side{width:270px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:10px}
#side .new{padding:12px;border:1px solid var(--line);background:var(--card2);border-radius:12px;cursor:pointer;font-weight:600}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.ci{display:flex;align-items:center;gap:6px;padding:10px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--mut)}
.ci.on,.ci:hover{background:var(--card2);color:var(--tx)}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci b{font-weight:400;opacity:.6;padding:2px 6px}
.me{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.out{padding:10px;border:0;background:none;color:var(--err);cursor:pointer;text-align:left}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
#top{display:none;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
#top button{border:0;background:none;font-size:22px;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.empty{margin:auto;text-align:center;color:var(--mut)}
.empty .logo{width:56px;height:56px;font-size:24px}
.m{max-width:min(720px,88%);padding:11px 14px;border-radius:16px;line-height:1.55;font-size:15px;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--pri);color:#0b0d12;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.e{border-color:var(--err);color:var(--err)}
.m .t{white-space:pre-wrap}
.m pre{background:#0b0d12;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;overflow:auto;font-size:13px}
.m code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.m .t code{background:#0b0d12;padding:1px 5px;border-radius:5px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
#bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);align-items:flex-end}
#bar textarea{flex:1;resize:none;max-height:140px;padding:12px 14px;background:var(--card2);border:1px solid var(--line);border-radius:14px;outline:none}
#bar button{width:46px;height:46px;border:0;border-radius:14px;background:var(--grad);color:#0b0d12;font-size:20px;font-weight:700;cursor:pointer}
#bar button:disabled{opacity:.5}
#shade{display:none}
@media(max-width:760px){
 #side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top))}
 #side.open{transform:none}
 #shade.open{display:block;position:fixed;inset:0;background:#0008;z-index:10}
 #top{display:flex}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="hide">
 <div class="box">
  <div class="logo">✦</div>
  <h1 id="ttl">Masuk ke NovaMind</h1>
  <p class="sub">Akunmu tersimpan di perangkat ini</p>
  <div class="tabs"><button id="tL" class="on" type="button">Masuk</button><button id="tR" type="button">Daftar</button></div>
  <div id="nameWrap" class="hide"><label for="name">Nama</label><input id="name" class="inp" autocomplete="name" placeholder="Nama kamu"></div>
  <label for="email">Email</label>
  <input id="email" class="inp" type="email" autocomplete="email" inputmode="email" autocapitalize="off" placeholder="nama@email.com">
  <label for="pass">Kata sandi</label>
  <div class="pw"><input id="pass" class="inp" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter"><button id="eye" type="button">👁</button></div>
  <label class="rem"><input id="rem" type="checkbox" checked> Ingat saya</label>
  <div id="msg"></div>
  <button id="go" class="go" type="button">Masuk</button>
  <p class="note">Kata sandi di-hash SHA-256 sebelum disimpan.</p>
 </div>
</div>

<!-- APP -->
<div id="app" class="hide">
 <aside id="side">
  <button class="new" id="newChat" type="button">＋ Chat baru</button>
  <div id="list"></div>
  <div class="me" id="me"></div>
  <button class="out" id="logout" type="button">Keluar</button>
 </aside>
 <div id="shade"></div>
 <section id="main">
  <div id="top"><button id="burger" type="button">☰</button><b>NovaMind</b></div>
  <div id="msgs"></div>
  <div id="bar">
   <textarea id="inp" rows="1" placeholder="Tulis pesan..."></textarea>
   <button id="send" type="button">➤</button>
  </div>
 </section>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);

/* ---------- Penyimpanan (aman kalau localStorage diblokir) ---------- */
const mem = {};
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
const ss = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return mem['s_'+k] ?? null; } },
  set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){ mem['s_'+k]=v; } },
  del(k){ try{ sessionStorage.removeItem(k); }catch(e){ delete mem['s_'+k]; } }
};
const readJSON = (s,k,d) => { try{ const v = s.get(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };

/* ---------- Hash ---------- */
function fallbackHash(str){
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'f'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
async function hash(text){
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return fallbackHash(text);
}
const salt = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

/* ---------- Auth ---------- */
let mode = 'login', user = null;
const USERS = 'nm_users', SESSION = 'nm_session';

function setMode(m){
  mode = m;
  $('#tL').classList.toggle('on', m==='login');
  $('#tR').classList.toggle('on', m==='reg');
  $('#nameWrap').classList.toggle('hide', m==='login');
  $('#ttl').textContent = m==='login' ? 'Masuk ke NovaMind' : 'Buat akun NovaMind';
  $('#go').textContent = m==='login' ? 'Masuk' : 'Daftar';
  $('#pass').autocomplete = m==='login' ? 'current-password' : 'new-password';
  showMsg('');
}
function showMsg(t, ok){ const m=$('#msg'); m.textContent=t; m.className = ok ? 'ok' : ''; }

async function submit(){
  const email = $('#email').value.trim().toLowerCase();
  const pass = $('#pass').value;
  const btn = $('#go');
  showMsg('');
  if(!/^\S+@\S+\.\S+$/.test(email)) return showMsg('Format email tidak valid');
  if(pass.length < 6) return showMsg('Kata sandi minimal 6 karakter');
  btn.disabled = true;
  try{
    const users = readJSON(ls, USERS, {});
    if(mode === 'reg'){
      if(users[email]) throw new Error('Email sudah terdaftar, silakan masuk');
      const s = salt();
      users[email] = { name: $('#name').value.trim() || email.split('@')[0], salt: s, hash: await hash(s+pass), created: Date.now() };
      ls.set(USERS, JSON.stringify(users));
      if(!readJSON(ls, USERS, {})[email]) throw new Error('Penyimpanan browser diblokir, matikan mode privat/Shields');
    } else {
      const u = users[email];
      if(!u) throw new Error('Akun tidak ditemukan di perangkat ini. Daftar dulu');
      if(await hash(u.salt+pass) !== u.hash) throw new Error('Kata sandi salah');
    }
    const sess = JSON.stringify({ email });
    if($('#rem').checked){ ls.set(SESSION, sess); ss.del(SESSION); } else { ss.set(SESSION, sess); ls.del(SESSION); }
    enter(email);
  }catch(e){
    showMsg(e && e.message ? e.message : 'Terjadi kesalahan');
  }finally{
    btn.disabled = false;
  }
}

function enter(email){
  const u = readJSON(ls, USERS, {})[email];
  if(!u){ logout(); return; }
  user = { email, name: u.name };
  $('#auth').classList.add('hide');
  $('#app').classList.remove('hide');
  $('#me').textContent = user.name + ' · ' + email;
  $('#pass').value = '';
  loadChats();
}
function logout(){
  ls.del(SESSION); ss.del(SESSION); user = null; chats = []; cur = null;
  $('#app').classList.add('hide');
  $('#auth').classList.remove('hide');
  closeSide();
}

/* ---------- Chat ---------- */
let chats = [], cur = null, busy = false;
const ckey = () => 'nm_chats_' + user.email;
const saveChats = () => ls.set(ckey(), JSON.stringify(chats));
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function loadChats(){
  chats = readJSON(ls, ckey(), []);
  cur = chats.length ? chats[0].id : null;
  renderList(); renderMsgs();
}
function newChat(){
  const c = { id: 'c'+Date.now(), title: 'Chat baru', msgs: [] };
  chats.unshift(c); cur = c.id; saveChats(); renderList(); renderMsgs(); closeSide();
  $('#inp').focus();
}
const getChat = () => chats.find(c => c.id === cur);

function renderList(){
  const l = $('#list'); l.innerHTML = '';
  chats.forEach(c => {
    const d = document.createElement('div');
    d.className = 'ci' + (c.id === cur ? ' on' : '');
    d.innerHTML = '<span>'+esc(c.title)+'</span><b title="Hapus">✕</b>';
    d.onclick = e => {
      if(e.target.tagName === 'B'){
        if(!confirm('Hapus chat ini?')) return;
        chats = chats.filter(x => x.id !== c.id);
        if(cur === c.id) cur = chats.length ? chats[0].id : null;
        saveChats(); renderList(); renderMsgs();
      } else { cur = c.id; renderList(); renderMsgs(); closeSide(); }
    };
    l.appendChild(d);
  });
}

function fmt(t){
  return t.split('```').map((p,i) => {
    if(i % 2){ return '<pre><code>' + esc(p.replace(/^\w*\n/,'')) + '</code></pre>'; }
    return '<div class="t">' + esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>') + '</div>';
  }).join('');
}
function bubble(role, html, err){
  const d = document.createElement('div');
  d.className = 'm ' + (role==='user' ? 'u' : 'a') + (err ? ' e' : '');
  d.innerHTML = html;
  $('#msgs').appendChild(d);
  return d;
}
function renderMsgs(){
  const box = $('#msgs'); box.innerHTML = '';
  const c = getChat();
  if(!c || !c.msgs.length){
    box.innerHTML = '<div class="empty"><div class="logo">✦</div><h2>Halo, ' + esc(user.name) + '</h2><p>Mau ngobrol apa hari ini?</p></div>';
    return;
  }
  c.msgs.forEach(m => bubble(m.role, m.role==='user' ? '<div class="t">'+esc(m.content)+'</div>' : fmt(m.content), m.err));
  box.scrollTop = box.scrollHeight;
}

async function send(){
  if(busy) return;
  const inp = $('#inp'), text = inp.value.trim();
  if(!text) return;
  if(!getChat()) newChat();
  const c = getChat();
  c.msgs.push({ role:'user', content:text });
  if(c.msgs.length === 1) c.title = text.slice(0,40);
  inp.value = ''; inp.style.height = 'auto';
  saveChats(); renderList(); renderMsgs();
  busy = true; $('#send').disabled = true;
  const wait = bubble('assistant', '<div class="dots"><span></span><span></span><span></span></div>');
  $('#msgs').scrollTop = $('#msgs').scrollHeight;
  try{
    const history = c.msgs.filter(m => !m.err).slice(-20).map(m => ({ role:m.role, content:m.content }));
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ messages: history }) });
    let data = {};
    try{ data = await r.json(); }catch(e){}
    if(!r.ok || !data.reply) throw new Error(data.error || ('Server error ' + r.status));
    c.msgs.push({ role:'assistant', content:data.reply });
  }catch(e){
    c.msgs.push({ role:'assistant', content:'Gagal: ' + (e.message || 'tidak bisa menghubungi server'), err:true });
  }
  busy = false; $('#send').disabled = false;
  saveChats(); renderMsgs();
}

/* ---------- Drawer mobile ---------- */
const closeSide = () => { $('#side').classList.remove('open'); $('#shade').classList.remove('open'); };

/* ---------- Event ---------- */
$('#tL').onclick = () => setMode('login');
$('#tR').onclick = () => setMode('reg');
$('#go').onclick = submit;
$('#eye').onclick = () => { const p=$('#pass'); p.type = p.type==='password' ? 'text' : 'password'; };
['email','pass','name'].forEach(id => $('#'+id).addEventListener('keydown', e => { if(e.key==='Enter') submit(); }));
$('#logout').onclick = logout;
$('#newChat').onclick = newChat;
$('#send').onclick = send;
$('#inp').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey && window.innerWidth > 760){ e.preventDefault(); send(); } });
$('#inp').addEventListener('input', e => { e.target.style.height='auto'; e.target.style.height = Math.min(e.target.scrollHeight,140)+'px'; });
$('#burger').onclick = () => { $('#side').classList.add('open'); $('#shade').classList.add('open'); };
$('#shade').onclick = closeSide;

/* ---------- Start ---------- */
const s = readJSON(ls, SESSION, null) || readJSON(ss, SESSION, null);
if(s && s.email && readJSON(ls, USERS, {})[s.email]) enter(s.email);
else $('#auth').classList.remove('hide');
})();
</script>
</body>
</html>
