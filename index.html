<!DOCTYPE html>
<html lang="id">
<head>
 <script src="auth.js"></script>

<title>NovaMind AI v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Syntax Highlighting -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#0C0E12;--gl:#14171C;--gl2:rgba(255,255,255,.05);--tx:#E9ECF1;--mu:#8D95A3;--ac:#4A68F5;--ac2:#6C86FF;--ac3:#8EA4FF;--bd:rgba(255,255,255,.09);--ub:var(--g);--g:linear-gradient(135deg,#5E7EFF,#8B5CF6);--glow:rgba(110,130,255,.35);--cd:rgba(255,255,255,.08);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);--fs:15px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F6F7F9;--gl:#FFFFFF;--gl2:rgba(16,24,40,.05);--tx:#14181F;--mu:#667085;--ac:#3F5CF0;--ac2:#2E49D6;--ac3:#3050E0;--bd:rgba(16,24,40,.11);--ub:var(--g);--g:linear-gradient(135deg,#4F6BFF,#7C4DEB);--glow:rgba(79,107,255,.28);--cd:rgba(16,24,40,.06);--sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);color-scheme:light}}
:root[data-theme="light"]{--bg:#F6F7F9;--gl:#FFFFFF;--gl2:rgba(16,24,40,.05);--tx:#14181F;--mu:#667085;--ac:#3F5CF0;--ac2:#2E49D6;--ac3:#3050E0;--bd:rgba(16,24,40,.11);--ub:var(--g);--g:linear-gradient(135deg,#4F6BFF,#7C4DEB);--glow:rgba(79,107,255,.28);--cd:rgba(16,24,40,.06);--sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);color-scheme:light}
*{box-sizing:border-box}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--mu);background-clip:padding-box;border:2px solid transparent}
html,body{height:100%;margin:0}
@supports(height:100dvh){html,body,#app{height:100dvh}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.7 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(50vmax 40vmax at 12% -5%,color-mix(in srgb,#6D7CFF 22%,transparent),transparent),radial-gradient(40vmax 36vmax at 100% 10%,color-mix(in srgb,#B15CF6 14%,transparent),transparent),radial-gradient(45vmax 30vmax at 55% 115%,color-mix(in srgb,#35D6E8 10%,transparent),transparent)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac3);outline-offset:2px}
#app{position:relative;z-index:1;display:flex;height:100%}
#side{width:272px;background:color-mix(in srgb,var(--gl) 78%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.logo{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.star{width:30px;height:30px;border-radius:9px;background:var(--g);box-shadow:0 6px 18px var(--glow);display:grid;place-items:center;color:#fff;font-size:15px}
.btn{padding:8px 13px;border-radius:10px;background:var(--gl2);border:1px solid var(--bd);font-size:13.5px;font-weight:500;transition:border-color .15s,background .15s,color .15s}
.btn:hover{border-color:var(--ac2)}
.pri{background:var(--g);color:#fff;font-weight:600;border:0}
.pri:hover{filter:brightness(1.1)}
#side .pri{margin:0 14px 12px;padding:10px 14px}
.search-box{margin:0 14px 10px;position:relative}
.search-box input{width:100%;padding:8px 12px 8px 32px;border-radius:10px;border:1px solid var(--bd);background:var(--gl2);color:var(--tx);font-size:13px;outline:none}
.search-box input:focus{border-color:var(--ac2)}
.search-box::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:16px;pointer-events:none}
#list{flex:1;overflow-y:auto;padding:0 8px 8px}
.it{display:flex;align-items:center;gap:6px;padding:9px 10px 9px 12px;border-radius:10px;color:var(--mu);margin-bottom:1px}
.it:hover{background:var(--gl2);color:var(--tx)}
.it.on{background:var(--gl2);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-size:13.5px}
.it b{font-weight:400;opacity:.5;cursor:pointer;padding:0 4px;border-radius:6px}
.it b:hover{opacity:1;color:#ff7a7a}
@media (hover:hover){.it b{opacity:0}.it:hover b,.it.on b{opacity:.55}.it b:hover{opacity:1}}
.stat{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header h2{margin:0;font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{display:none}
.pill{display:flex;align-items:center;gap:7px;max-width:200px;padding:6px 11px;border-radius:10px;background:var(--gl);border:1px solid var(--bd);font-size:12.5px;font-weight:500}
.pill:hover{border-color:var(--ac2)}
.pill i{width:7px;height:7px;border-radius:50%;background:#3DD68C;flex-shrink:0}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{background:var(--gl2);border:1px solid var(--bd);border-radius:10px;padding:7px 10px;max-width:150px;font-size:13px}
select option{background:var(--gl);color:var(--tx)}
#msgs{flex:1;overflow-y:auto;padding:20px 16px 24px}
.w{max-width:760px;margin:0 auto}
.m{display:flex;gap:12px;margin-bottom:28px;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.av{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;background:var(--gl2);font-size:14px;margin-top:2px}
.m.a .av{background:var(--g);color:#fff;box-shadow:0 4px 12px var(--glow)}
.m.u .av{display:none}
.bub{min-width:0;flex:1}
.m.u{flex-direction:row-reverse}
.m.u .bub{flex:none;max-width:85%;background:var(--ub);color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px;box-shadow:0 6px 20px var(--glow);white-space:pre-wrap;word-wrap:break-word}
.m.a .bub{word-wrap:break-word}
.bub p{margin:0 0 .75em;max-width:72ch}
.bub ul,.bub ol{margin:.3em 0 .85em;padding-left:1.4em;max-width:72ch}
.bub li{margin-bottom:.25em}
.bub h3,.bub h4{margin:1.1em 0 .45em;font-weight:650;letter-spacing:-.01em;line-height:1.35}
.bub h3{font-size:1.15em}
.bub h4{font-size:1.02em}
.bub strong{font-weight:650}
.bub code{background:var(--cd);padding:2px 6px;border-radius:6px;font-size:.87em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bub pre{background:#0E1116;border:1px solid var(--bd);border-radius:12px;padding:0;overflow:hidden;margin:.7em 0}
.bub pre code{background:none;padding:14px;display:block;overflow-x:auto;border-radius:0;font-size:12.5px;line-height:1.65}
.bub img.mi{display:block;max-width:100%;height:auto;border-radius:12px;margin:.5em 0;cursor:zoom-in;background:var(--gl2)}
.bub a{color:var(--ac3);overflow-wrap:anywhere;text-underline-offset:2px}
.cb{position:relative}
.cpb{position:absolute;top:6px;right:8px;z-index:1;font-size:11.5px;font-weight:500;padding:4px 11px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#A9B1BE}
.cpb:hover{color:#fff;background:rgba(255,255,255,.12)}
.pvb{right:72px;color:#8EA4FF}
.cbl{position:absolute;top:11px;left:14px;font-size:11.5px;color:#8D95A3;text-transform:lowercase;font-weight:600;z-index:1}
.cb pre{padding-top:38px;position:relative}
.cb pre::before{content:'';position:absolute;top:0;left:0;right:0;height:38px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);pointer-events:none}
.btn.on{border-color:var(--ac2);background:color-mix(in srgb,var(--ac) 16%,transparent)}
#prv{display:none;position:fixed;inset:0;z-index:28;background:var(--bg);flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#prv.on{display:flex}
.prh{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--bd)}
.prh b{flex:1;font-size:14px;font-weight:600}
.prt{display:flex;gap:6px}
.prs{display:flex;gap:6px;padding:8px 12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.prs .btn{padding:6px 11px;font-size:12.5px}
.prw{flex:1;min-height:0;display:flex;justify-content:center;background:var(--gl2)}
#prf{height:100%;max-width:100%;width:100%;border:0;background:#fff;transition:width .2s}
#prk{flex:1;margin:0;overflow:auto;padding:14px;background:var(--cd);font-size:12.5px;display:none}
#prc{max-height:130px;overflow:auto;border-top:1px solid var(--bd);background:var(--cd);font:12px/1.5 ui-monospace,monospace;padding:6px 12px;display:none}
.cl{white-space:pre-wrap;overflow-wrap:anywhere}.cl.error{color:#ff7a7a}.cl.warn{color:#f6b94c}
.ph{display:block;margin:.7em 0}
.ph .mi{width:100%;max-height:340px;object-fit:cover}
.phl{display:block;color:var(--mu);font-size:12.5px;padding:22px;border:1px dashed var(--bd);border-radius:12px;text-align:center}
.phc{display:block;font-size:11.5px;color:var(--mu);margin-top:3px}
.tw{overflow-x:auto;margin:.7em 0;border:1px solid var(--bd);border-radius:12px}
.tw table{border-collapse:collapse;width:100%;font-size:.92em}
.tw th,.tw td{border-bottom:1px solid var(--bd);padding:8px 12px;text-align:left;vertical-align:top}
.tw tr:last-child td{border-bottom:0}
.tw th{background:var(--gl2);font-weight:600}
.err{color:#ff8a8a}
.act{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px}
.act button{color:var(--mu);font-weight:500}.act button:hover{color:var(--tx)}
.dots::after{content:"●●●";letter-spacing:3px;color:var(--mu);animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots::after,.m{animation:none}}
.empty{text-align:left;padding:10vh 0 0}
.empty .star{margin:0!important;border-radius:16px!important;box-shadow:0 12px 40px var(--glow)}
.empty h1{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:20px 0 8px;background:linear-gradient(100deg,var(--tx) 35%,var(--ac3));-webkit-background-clip:text;background-clip:text;color:transparent}
.empty p{color:var(--mu);margin:0 0 26px;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.chips button{padding:13px 15px;border-radius:12px;border:1px solid var(--bd);background:color-mix(in srgb,var(--gl) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13.5px;line-height:1.45;text-align:left;font-weight:500;transition:border-color .15s,transform .15s,background .15s}
.chips button:hover{transform:translateY(-2px);border-color:var(--ac2);background:color-mix(in srgb,var(--ac) 8%,var(--gl))}
#bar{padding:6px 16px 14px}
.box{max-width:760px;margin:0 auto;display:flex;gap:6px;align-items:flex-end;background:color-mix(in srgb,var(--gl) 85%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:20px;padding:7px;box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--ac2);box-shadow:var(--sh),0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
textarea{flex:1;background:none;border:0;resize:none;outline:0;max-height:160px;padding:8px 8px;font-size:16px;line-height:1.5}
textarea::placeholder{color:var(--mu)}
.send{box-shadow:0 4px 14px var(--glow);width:38px;height:38px;border-radius:12px;flex-shrink:0;padding:0;font-size:19px;font-weight:700;line-height:1}
.note{max-width:760px;margin:8px auto 0;text-align:center;font-size:11px;color:var(--mu)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:20;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
.modal{background:var(--gl);border:1px solid var(--bd);border-radius:18px;padding:20px;width:100%;max-width:480px;max-height:92%;overflow-y:auto;box-shadow:var(--sh)}
.modal h3{margin:0 0 12px;font-size:16px;font-weight:650}.modal label{display:block;margin:14px 0 6px;font-size:13px;font-weight:500;color:var(--mu)}
.modal select,.modal input[type=text],.modal input[type=password],.modal input[type=range],.modal textarea{width:100%;max-width:none}
.modal input[type=text],.modal input[type=password],.modal textarea{background:var(--gl2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:14px}
.modal input[type=text]:focus,.modal input[type=password]:focus{outline:0;border-color:var(--ac2)}
.modal input[type=range]{accent-color:var(--ac)}
.modal input[type=checkbox]{accent-color:var(--ac);margin-right:6px}
.modal textarea{min-height:70px}
.pvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--gl2);text-align:left;font-size:13px}
.pv small{display:block;color:var(--mu);font-size:11px}
.pv.on{border-color:var(--ac2);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.hint{font-size:11.5px;color:var(--mu);margin-top:5px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13px;font-weight:500;z-index:30;display:none;max-width:90%;box-shadow:var(--sh)}
@media (max-width:760px){
#side{position:fixed;left:-300px;top:0;bottom:0;z-index:15;transition:left .2s;padding-top:env(safe-area-inset-top,0px);background:var(--gl)}
#side.on{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
#menu{display:block}
select{max-width:110px}
}
.box{position:relative}
.ic{width:38px;height:38px;border-radius:12px;padding:0;flex-shrink:0;display:grid;place-items:center;font-size:22px;line-height:1}
.btn.ic{background:transparent;border-color:transparent;color:var(--mu)}
.btn.ic:hover{background:var(--gl2);border-color:transparent;color:var(--tx)}
#mic.rec{background:#e5484d;border-color:#e5484d;color:#fff;animation:pu 1.2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 8px rgba(229,72,77,.25)}}
@media (prefers-reduced-motion:reduce){#mic.rec{animation:none}}
#atts{max-width:760px;margin:0 auto 8px;display:flex;gap:8px;overflow-x:auto}
#atts:empty{display:none}
.ch{display:flex;align-items:center;gap:6px;background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:5px 9px;font-size:12px;flex-shrink:0}
.ch img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.ch span{font-weight:700;font-size:10px;color:var(--ac3)}
.ch em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.ch b{cursor:pointer;opacity:.6;padding:2px}
#pm{display:none;position:absolute;left:0;bottom:calc(100% + 10px);background:var(--gl);border:1px solid var(--bd);border-radius:14px;padding:6px;min-width:200px;z-index:5;box-shadow:var(--sh)}
#pm.on{display:block}
#pm button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:13.5px}
#pm button:hover{background:var(--gl2)}
.at{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.at img{max-width:150px;max-height:130px;border-radius:12px}
.fc{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:9px;font-size:12px}
#cam{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:25;align-items:center;justify-content:center;padding:16px}
#cam.on{display:flex}
.cm{background:var(--gl);border:1px solid var(--bd);border-radius:18px;padding:14px;max-width:520px;width:100%}
#vid{width:100%;border-radius:12px;background:#000}
#sbk{display:none;margin-left:auto;padding:6px 11px;font-size:13px;font-weight:500}
@media (max-width:760px){#sbk{display:block}}
html,body{max-width:100%;overflow-x:hidden}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#main,#msgs,.w{min-width:0}
.bub{overflow-wrap:anywhere}
@media (max-width:760px){
header{flex-wrap:wrap;gap:6px 8px;padding:10px 12px}
header h2{min-width:0;font-size:14px}
header .btn{padding:7px 11px}
#pl{order:5;flex:1 1 0;max-width:none;min-width:0}
#per{order:6;flex:1 1 0;max-width:none;min-width:0}

}
#kf{display:none!important}
body.need-code #kf{display:block!important}

/* --- polesan tambahan --- */
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(color-mix(in srgb,var(--tx) 16%,transparent) 1px,transparent 1.3px);background-size:26px 26px;-webkit-mask-image:radial-gradient(70% 55% at 50% 0%,#000,transparent);mask-image:radial-gradient(70% 55% at 50% 0%,#000,transparent);opacity:.55}
.empty{position:relative}
.empty::before{content:"";position:absolute;left:-50px;top:-10px;width:280px;height:280px;background:radial-gradient(circle,var(--glow),transparent 70%);filter:blur(34px);z-index:-1;opacity:.7;pointer-events:none}
.chips button::before{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;margin-bottom:9px;background:color-mix(in srgb,var(--ac) 16%,transparent);font-size:15px}
.chips button:nth-child(1)::before{content:"\1F4A1"}
.chips button:nth-child(2)::before{content:"\1F9ED"}
.chips button:nth-child(3)::before{content:"\1F3AF"}
.chips button:nth-child(4)::before{content:"\1F680"}
.chips button:hover::before{background:var(--g)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.empty .star,.empty h1,.empty p{animation:up .5s backwards}
.empty h1{animation-delay:.06s}.empty p{animation-delay:.12s}
.chips button{animation:up .5s backwards}
.chips button:nth-child(1){animation-delay:.18s}.chips button:nth-child(2){animation-delay:.24s}.chips button:nth-child(3){animation-delay:.30s}.chips button:nth-child(4){animation-delay:.36s}
.dots::after{color:var(--ac3)}
.box:focus-within .send{box-shadow:0 6px 20px var(--glow)}
.it.on{background:color-mix(in srgb,var(--ac) 12%,transparent)}
@media (prefers-reduced-motion:reduce){.empty .star,.empty h1,.empty p,.chips button{animation:none!important}}

/* --- muat di layar HP tanpa scroll --- */
@media (max-width:760px){
.empty{padding-top:2vh}
.empty .star{width:44px!important;height:44px!important;font-size:22px!important;border-radius:14px!important}
.empty h1{font-size:26px;margin:14px 0 6px}
.empty p{font-size:14px;margin:0 0 16px;line-height:1.5}
.chips{grid-template-columns:1fr;gap:8px}
.chips button{padding:11px 13px;font-size:13px}
.chips button::before{display:none}
.empty::before{width:200px;height:200px;left:-30px}
}
@media (max-height:600px){.empty .star,.empty p{display:none}.empty{padding-top:0}}

const OA={t:'oa',h:'Buat di platform.openai.com'};

dproxy:{n:'Dattio AI',d:'',t:'oa',custom:1,kh:'Isi kode akses (ACCESS_CODE) milikmu. Boleh kosong bila proxy tanpa kode.',m:DM}};
const $=id=>document.getElementById(id);
let S={chats:[],cur:null,set:{prov:'claude',keys:{},models:{},urls:{},custom:'',size:15,theme:'auto',enter:true},st:{i:0,o:0}};
try{const r=JSON.parse(localStorage.getItem('nm2')||'null');if(r){S=Object.assign(S,r);S.set=Object.assign({prov:'claude',keys:{},models:{},urls:{},custom:'',size:15,theme:'auto',enter:true},r.set)}}catch(e){}
const save=()=>{try{localStorage.setItem('nm2',JSON.stringify(S,(k,v)=>(k==='d'||k==='x')?undefined:v))}catch(e){}};

S.set.prov='dproxy';
if((S.set.keys.dproxy||'').trim())document.body.classList.add('need-code');
let sample=null,busy=false,ctl=null,pend=[];

const PHR={},PHP={};
const qaG=x=>String(x).replace(/"/g,'&quot;');
function phInner(r,q){return '<img class="mi" src="'+qaG(r.src)+'" alt="'+qaG(q)+'" loading="lazy" referrerpolicy="no-referrer"><span class="phc">'+esc(r.title)+' · <a href="'+qaG(r.url)+'" target="_blank" rel="noopener noreferrer">Wikipedia</a></span>'}
function photo(q){
 const k=q.toLowerCase();
 return PHP[k]||(PHP[k]=(async()=>{
  for(const lang of ['id','en']){
   try{
    const r=await fetch('https://'+lang+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=4&gsrsearch='+encodeURIComponent(q)+'&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=900');
    const j=await r.json(),pg=Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index).find(x=>x.thumbnail&&/^https:\/\/upload\.wikimedia\.org\//.test(x.thumbnail.source));
    if(pg&&/^https:\/\//.test(pg.fullurl||''))return{src:pg.thumbnail.source,title:pg.title,url:pg.fullurl};
   }catch(e){}
  }
  return null;
 })());
}
function hydrate(root){
 (root||document).querySelectorAll('.ph[data-q]:not([data-d])').forEach(el=>{
  el.dataset.d='1';const q=el.dataset.q;
  photo(q).then(r=>{PHR[q.toLowerCase()]=r;if(!el.isConnected)return;if(!r){el.remove();return}el.removeAttribute('data-q');el.innerHTML=phInner(r,q)});
 });
}
function md(s){
 const bl=[];s=esc(s).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{bl.push({c:c.replace(/\n$/,''),l});return '\u0000'+(bl.length-1)+'\u0000'});
 s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');
 const qa=x=>x.replace(/"/g,'&quot;');
 s=s.replace(/!\[([^\]\n]*)\]\((https:\/\/[^\s)]+|data:image\/(?:png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+)\)/g,(_,a,u)=>'<img class="mi" src="'+qa(u)+'" alt="'+qa(a)+'" loading="lazy" referrerpolicy="no-referrer">')
  .replace(/\[([^\]\n]+)\]\((https:\/\/[^\s)]+)\)/g,(_,t,u)=>'<a href="'+qa(u)+'" target="_blank" rel="noopener noreferrer">'+t+'</a>');
 let pc=0;
 s=s.replace(/\[\[foto:\s*([^\]\n]{2,80}?)\s*\]\]/gi,(_,q0)=>{
  if(++pc>3)return '';
  const q=unesc(q0),r=PHR[q.toLowerCase()];
  if(r===null)return '';
  return '<span class="ph"'+(r?'>'+phInner(r,q):' data-q="'+qa(q)+'"><span class="phl">Memuat foto…</span>')+'</span>';
 }).replace(/\[\[foto:[^\]]*$/i,'');
 const tbl=rows=>{
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const sep=rows.length>1&&/^\s*\|?[\s:|-]+\|?\s*$/.test(rows[1])&&/-/.test(rows[1]);
  const head=sep?cells(rows[0]):null,body=rows.slice(sep?2:0).map(cells);
  return '<div class="tw"><table>'+(head?'<thead><tr>'+head.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead>':'')+'<tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
 };
 const out=[];let ul=null,tb=null;
 for(const ln of s.split('\n')){
  const isT=/^\s*\|.*\|\s*$/.test(ln);
  if(tb&&!isT){out.push(tbl(tb));tb=null}
  if(isT){if(ul){out.push('</'+ul+'>');ul=null}(tb=tb||[]).push(ln);continue}
  let m;
  if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(ul!=='ul'){out.push(ul?'</'+ul+'>':'','<ul>');ul='ul'}out.push('<li>'+m[1]+'</li>')}
  else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(ul!=='ol'){out.push(ul?'</'+ul+'>':'','<ol>');ul='ol'}out.push('<li>'+m[1]+'</li>')}
  else{if(ul){out.push('</'+ul+'>');ul=null}
   if(m=ln.match(/^#{1,2}\s+(.*)/))out.push('<h3>'+m[1]+'</h3>');else if(m=ln.match(/^#{3,}\s+(.*)/))out.push('<h4>'+m[1]+'</h4>');
   else if(ln.trim())out.push('<p>'+ln+'</p>')}
 }
 if(tb)out.push(tbl(tb));
 if(ul)out.push('</'+ul+'>');
 return out.join('').replace(/\u0000(\d+)\u0000/g,(_,i)=>{
  const b=bl[i],pv=/^(html?|svg)$/i.test(b.l)||(!b.l&&/^\s*(<!doctype html|<html[\s>])/i.test(unesc(b.c)));
  
  // Syntax Highlighting Integration
  let hlCode = b.c;
  if (window.hljs) {
    try {
        const raw = unesc(b.c);
        hlCode = b.l && hljs.getLanguage(b.l) ? hljs.highlight(raw, {language: b.l}).value : hljs.highlightAuto(raw).value;
    } catch(e) {}
  }
  
  return '<div class="cb">'+(b.l?'<span class="cbl">'+esc(b.l)+'</span>':'')+(pv?'<button class="cpb pvb" data-a="pv">▶ Preview</button>':'')+'<button class="cpb" data-a="cc">Salin</button><pre><code class="hljs">'+hlCode+'</code></pre></div>'
 }).replace(/<p>(<div class="cb">[\s\S]*?<\/pre><\/div>)<\/p>/g,'$1').replace(/<p>(<span class="ph"[\s\S]*?<\/span><\/span>)<\/p>/g,'$1');
}

 }

const srch=ph=>'<div class="srch2">'+I('search',16)+'<input type="text" id="xq" data-q="1" placeholder="'+ph+'" value="'+esc(qs)+'"></div>';
const V={
akun:()=>{const ms=S.chats.reduce((a,c)=>a+c.msgs.length,0),tk=S.st.i+S.st.o,nm=X.name||'Pengguna NovaMind',sn={singkat:'Singkat',seimbang:'Seimbang',detail:'Detail',santai:'Santai',formal:'Formal'};
 return['Akun','<div class="hero"><div class="top"><div class="av2">'+esc(X.av||nm.charAt(0).toUpperCase())+'</div><div><span class="badge">GRATIS</span><h2>'+esc(nm)+'</h2><p>'+esc(X.bio||'Lengkapi profilmu agar AI mengenalmu')+'</p></div></div><div class="hs"><div><b>'+S.chats.length+'</b><span>Chat</span></div><div><b>'+ms+'</b><span>Pesan</span></div><div><b>'+(tk>999?(tk/1000).toFixed(1)+'k':tk)+'</b><span>Token</span></div></div></div>'
 +'<div class="xl">Akun</div><div class="xg">'+row('user','#5B8CFF','Profil','Nama, avatar, tentang saya','profil')+row('card','#22C55E','Penagihan','Pemakaian & paket','tagih','Gratis')+'</div>'
 +'<div class="xl">Preferensi</div><div class="xg">'+row('vol','#F0589B','Suara','Bacakan jawaban, bahasa rekam','suara')+row('spark','#8B5CF6','Gaya','Cara AI menjawab','gaya',sn[X.style])+row('type','#0EA5E9','Font','Jenis & ukuran huruf','font',S.set.size+'px')+row('bell','#F59E0B','Notifikasi','Pemberitahuan & bunyi','notif',X.notif||X.sound?'Aktif':'Mati')+'</div>'
 +'<div class="xl">Produktivitas</div><div class="xg">'+row('clock','#14B8A6','Waktu dan fokus','Timer fokus & info waktu','waktu',tm?fmt(left):X.fmin+' mnt')+row('share','#6366F1','Berbagi','Bagikan atau ekspor chat','bagi')+row('msg','#EC4899','Umpan balik','Kirim saran atau laporan','fb',X.fb.length?X.fb.length+' tersimpan':'')+'</div>'
 +'<div class="xl"></div><div class="xg">'+row('out','#e5484d','Keluar akun','Hapus data masuk di perangkat ini','keluar','',1)+'</div>']},
profil:()=>['Profil','<div class="xg"><div class="fld"><label class="f">Avatar (emoji, kosong = inisial)</label><input type="text" data-k="av" maxlength="4" value="'+esc(X.av)+'" placeholder="🙂"></div><div class="fld"><label class="f">Nama</label><input type="text" data-k="name" value="'+esc(X.name)+'" placeholder="Nama panggilanmu"></div><div class="fld"><label class="f">Tentang saya</label><textarea data-k="bio" placeholder="Pekerjaan, minat, preferensi jawaban…">'+esc(X.bio)+'</textarea></div></div><p class="note2">Nama dan deskripsi ini dikirim ke AI sebagai konteks agar jawabannya lebih personal. Disimpan hanya di browser ini.</p>'],
tagih:()=>{const i=S.st.i,o=S.st.o,m=Math.max(i,o,1);return['Penagihan','<div class="hero"><div class="top"><div><span class="badge">PAKET AKTIF</span><h2>Gratis</h2><p>Lewat proxy Dattio. Tidak ada tagihan di aplikasi ini.</p></div></div></div><div class="xl">Pemakaian (perkiraan)</div><div class="xg"><div class="mt"><div><span>Token masuk</span><b>'+i.toLocaleString('id-ID')+'</b></div><div class="meter"><i style="width:'+(i/m*100)+'%"></i></div></div><div class="mt"><div><span>Token keluar</span><b>'+o.toLocaleString('id-ID')+'</b></div><div class="meter"><i style="width:'+(o/m*100)+'%"></i></div></div><div class="mt"><div><span>Riwayat</span><small>'+S.chats.length+' chat · '+S.chats.reduce((a,c)=>a+c.msgs.length,0)+' pesan</small></div></div></div><div class="bt"><button class="btn wd" data-a="rs">'+I('trash',16)+'Reset statistik</button></div><p class="note2">Token dihitung perkiraan (±4 karakter per token) dan tersimpan lokal.</p>']},
suara:()=>{const vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).map(v=>[v.name,v.name+' ('+v.lang+')']);return['Suara','<div class="xg">'+tg('read','Bacakan jawaban otomatis','Jawaban AI dibaca setelah selesai')+'</div><div class="xl">Suara pembaca</div><div class="xg"><div class="fld"><label class="f">Suara</label><select data-k="voice"><option value="">Bawaan perangkat</option>'+op(vs,X.voice)+'</select></div><div class="fld"><label class="f">Kecepatan: '+X.rate+'×</label><input type="range" data-k="rate" min="0.5" max="2" step="0.1" value="'+X.rate+'"></div><div class="fld"><label class="f">Nada: '+X.pitch+'</label><input type="range" data-k="pitch" min="0.5" max="2" step="0.1" value="'+X.pitch+'"></div></div><div class="xl">Rekam suara</div><div class="xg"><div class="fld"><label class="f">Bahasa</label><select data-k="vl"><option value="id-ID"'+((S.set.vl||'id-ID')==='id-ID'?' selected':'')+'>Indonesia</option><option value="en-US"'+(S.set.vl==='en-US'?' selected':'')+'>English</option></select></div></div><div class="bt"><button class="btn pri wd" data-a="tts">'+I('play',15)+'Tes suara</button><button class="btn wd" data-a="stp">'+I('stop',15)+'Berhenti</button></div>']},
gaya:()=>['Gaya','<p class="note2" style="margin:0 6px 12px">Atur nada jawaban AI. Berlaku untuk semua persona di chat berikutnya.</p>'+opts('style',[['singkat','Singkat','Langsung ke inti'],['seimbang','Seimbang','Default, secukupnya'],['detail','Detail','Rinci dengan contoh'],['santai','Santai','Akrab & ringan'],['formal','Formal','Profesional & rapi']],X.style)],
font:()=>['Font','<div class="xg"><div class="fld" style="font-family:'+FN[X.font]+';font-size:'+S.set.size+'px"><b style="font-size:1.15em">Contoh tampilan</b><p style="margin:6px 0 0;color:var(--mu)">Rubah ide menjadi nyata, satu langkah pada satu waktu.</p></div></div><div class="xl">Jenis huruf</div>'+opts('font',[['jakarta','Plus Jakarta','Modern, bersih'],['system','Sistem','Bawaan perangkat'],['serif','Serif','Klasik, nyaman dibaca'],['mono','Monospace','Gaya teknis']],X.font,k=>'font-family:'+FN[k])+'<div class="xl">Ukuran</div><div class="xg"><div class="fld"><label class="f">'+S.set.size+' px</label><input type="range" data-k="size" min="13" max="19" value="'+S.set.size+'"></div></div>'],
fb:()=>['Umpan balik','<div class="xg"><div class="fld"><label class="f">Kategori</label><select id="fbc"><option>Saran</option><option>Bug</option><option>Lainnya</option></select></div><div class="fld"><label class="f">Pesan</label><textarea id="fbm" placeholder="Tulis masukanmu…"></textarea></div></div><div class="bt"><button class="btn pri wd" data-a="fbs">'+I('check',16)+'Simpan</button><button class="btn wd" data-a="fbx">'+I('dl',16)+'Unduh semua</button></div><div class="xl">Tersimpan ('+X.fb.length+')</div>'+(X.fb.slice().reverse().map(f=>'<div class="xi"><div class="bd"><b><span class="tag">'+esc(f.k)+'</span>'+new Date(f.t).toLocaleString('id-ID')+'</b><p style="margin:8px 0 0;font-size:13.5px;white-space:pre-wrap">'+esc(f.m)+'</p></div></div>').join('')||empty('msg','Belum ada umpan balik','Masukanmu tersimpan di perangkat ini.'))],
notif:()=>['Notifikasi','<div class="xg">'+tg('notif','Notifikasi jawaban selesai','Saat tab ada di latar belakang')+tg('sound','Bunyi saat jawaban selesai','Nada singkat')+'</div><p class="note2">Izin browser: '+(window.Notification?Notification.permission:'tidak didukung')+'</p><div class="bt"><button class="btn pri wd" data-a="nt">'+I('bell',16)+'Tes notifikasi</button></div>'],
waktu:()=>['Waktu dan fokus','<div class="xrw"><svg viewBox="0 0 120 120"><defs><linearGradient id="xgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5E7EFF"/><stop offset="1" stop-color="#E0509A"/></linearGradient></defs><circle class="bg" cx="60" cy="60" r="54"/><circle id="xring" class="fg" cx="60" cy="60" r="54" stroke-dasharray="339.3" stroke-dashoffset="'+(tm?339.3*(1-left/(X.fmin*60)):0)+'"/></svg><div id="xbig">'+fmt(tm?left:X.fmin*60)+'</div></div><div class="chps">'+[15,25,45,60].map(n=>'<button class="'+(X.fmin===n?'on':'')+'" data-pick="fmin|'+n+'">'+n+' mnt</button>').join('')+'</div><div class="bt" style="justify-content:center"><button class="btn pri" style="padding:12px 26px" data-a="'+(tm?'tx':'ts')+'">'+I(tm?'stop':'play',16)+(tm?'Hentikan':'Mulai fokus')+'</button></div><div class="xl">Pengaturan</div><div class="xg">'+tg('time','Beri tahu AI waktu sekarang','Tanggal & jam ikut dikirim ke AI')+'</div><p class="note2">Mode fokus menyembunyikan menu dan pilihan AI sampai timer selesai.</p>'],
bagi:()=>['Berbagi','<div class="xg">'+row('share','#6366F1','Bagikan chat ini','Lewat menu bagikan perangkat','','')+row('link','#0EA5E9','Salin tautan aplikasi','Alamat halaman ini','','')+row('dl','#22C55E','Unduh chat (.md)','Simpan sebagai Markdown','','')+'</div>'.replace('','')],
keluar:()=>['Keluar akun','<div class="hero" style="background:linear-gradient(135deg,#e5484d,#a21caf)"><div class="top"><div><span class="badge">PERHATIAN</span><h2>Yakin ingin keluar?</h2><p>Kode akses dan profil di perangkat ini akan dihapus.</p></div></div></div><div class="xl"></div><div class="xg"><label class="tg"><span>Hapus juga riwayat chat<small>Tidak bisa dikembalikan</small></span><input type="checkbox" id="xall"></label></div><div class="bt"><button class="btn wd" data-a="out" style="color:#ff6b6b;border-color:#ff6b6b">'+I('out',16)+'Keluar sekarang</button></div>'],
proyek:()=>['Proyek','<div class="xg"><div class="fld"><label class="f">Nama proyek</label><input type="text" id="pn" placeholder="mis. Toko Online"></div><div class="fld"><label class="f">Instruksi untuk AI</label><textarea id="pi" placeholder="Konteks atau aturan khusus proyek ini…"></textarea></div></div><div class="bt"><button class="btn pri wd" data-a="pa">'+I('plus',16)+'Tambah proyek</button>'+(X.ap?'<button class="btn wd" data-a="p0">Nonaktifkan</button>':'')+'</div><div class="xl">Daftar ('+X.proj.length+')</div>'+(X.proj.map(p=>'<div class="xi'+(p.id===X.ap?' on':'')+'"><div class="bd"><b>'+(p.id===X.ap?'<span class="tag">AKTIF</span>':'')+esc(p.n)+'</b><small style="display:block;margin-top:4px;white-space:normal">'+esc(p.i.slice(0,120)||'Tanpa instruksi')+'</small><div class="bt"><button class="btn" data-a="pu" data-i="'+p.id+'">'+I('check',14)+'Pakai</button><button class="btn" data-a="pd" data-i="'+p.id+'">'+I('trash',14)+'Hapus</button></div></div></div>').join('')||empty('folder','Belum ada proyek','Buat proyek untuk memberi AI konteks khusus.'))],
artefak:()=>['Artefak',srch('Cari artefak…')+'<div id="xlist">'+list2(1)+'</div>'],
kode:()=>{const ls=['semua',...new Set(blocks().map(b=>b.l))];return['Kode',srch('Cari kode…')+'<div class="chps" style="justify-content:flex-start;margin-bottom:14px;overflow-x:auto;flex-wrap:nowrap">'+ls.map(l=>'<button class="'+(l===lf?'on':'')+'" data-pick="lf|'+l+'">'+esc(l)+'</button>').join('')+'</div><div id="xlist">'+list2(0)+'</div>']}};
// router
const xp=$('xp'),xc=$('xc');let cv='akun',stk=[];
$('xb').innerHTML=I('back',20);
function go(v,back){if(!back&&xp.classList.contains('on'))stk.push(cv);if(!back)qs='',lf='semua';cv=v;const r=V[v]();$('xt').textContent=r[0];xc.innerHTML=r[1];xc.scrollTop=0;xp.classList.add('on');$('side').classList.remove('on')}
function bk(){if(stk.length)go(stk.pop(),1);else{xp.classList.remove('on');cv='akun'}}
const rr=()=>{const y=xc.scrollTop;go(cv,1);xc.scrollTop=y};
$('xb').onclick=bk;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&xp.classList.contains('on')&&!$('prv').classList.contains('on'))bk()});
const nav=document.createElement('div');nav.className='xn';
nav.innerHTML=[['user','Akun','akun','#5B8CFF'],['folder','Proyek','proyek','#F59E0B'],['layers','Artefak','artefak','#F0589B'],['code','Kode','kode','#22C55E']].map(a=>'<button data-v="'+a[2]+'"><span class="ti" style="--c:'+a[3]+'">'+I(a[0],15)+'</span>'+a[1]+'</button>').join('');
$('list').before(nav);
nav.onclick=e=>{const b=e.target.closest('button');if(b){stk=[];xp.classList.remove('on');go(b.dataset.v)}};
// binding
xc.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;
 if(t.dataset.q){qs=t.value;const l=document.getElementById('xlist');if(l){l.innerHTML=list2(cv==='artefak')}return}
 if(!k)return;const v=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;
 if(k==='size'){S.set.size=v;applySet();save()}else if(k==='vl'){S.set.vl=v;save()}else{X[k]=v;sv()}
 if(k==='notif'&&v&&window.Notification&&Notification.permission==='default')Notification.requestPermission().then(rr)});
xc.addEventListener('change',e=>{const k=e.target.dataset.k;if(['rate','pitch','size'].includes(k))rr()});
xc.addEventListener('click',async e=>{
 const pk=e.target.closest('[data-pick]');if(pk){const[k,v]=pk.dataset.pick.split('|');if(k==='lf')lf=v;else if(k==='fmin'){if(tm)return;X.fmin=+v}else X[k]=v;if(k!=='lf')sv();if(k==='font')fx();rr();return}
 const r=e.target.closest('[data-v]');if(r){if(r.dataset.v)go(r.dataset.v);else{const t=r.querySelector('b').textContent;if(t.startsWith('Bagikan'))act('sh');else if(t.startsWith('Salin'))act('sl');else act('se')}return}
 const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.i)});
async function act(a,i){const c=cache[+i];
 if(a==='pv')openPreview(c.c);
 else if(a==='cp')toast(await copyText(c.c)?'Tersalin':'Gagal menyalin');
 else if(a==='dl')dl(c.c,'novamind-'+c.l+(isH(c)?'.html':'.txt'),isH(c)?'text/html':'text/plain');
 else if(a==='rs'){S.st={i:0,o:0};save();rr()}
 else if(a==='tts')speak('Halo, ini suara NovaMind.');
 else if(a==='stp'){try{speechSynthesis.cancel()}catch(x){}}
 else if(a==='fbs'){const m=$('fbm').value.trim();if(!m){toast('Pesan masih kosong');return}X.fb.push({k:$('fbc').value,m,t:Date.now()});sv();toast('Tersimpan, terima kasih!');rr()}
 else if(a==='fbx')dl(JSON.stringify(X.fb,null,2),'novamind-umpan-balik.json','application/json');
 else if(a==='nt'){if(!window.Notification){toast('Tidak didukung');return}const p=await Notification.requestPermission();if(p==='granted')new Notification('NovaMind',{body:'Notifikasi aktif ✓'});else toast('Izin ditolak');rr()}
 else if(a==='ts'){tstart();rr()}
 else if(a==='tx'){tstop();rr()}
 else if(a==='sh'){const ch=cur();if(!ch||!ch.msgs.length){toast('Belum ada chat');return}const t=ch.title+'\n\n'+ch.msgs.map(m=>(m.r==='u'?'Kamu: ':'NovaMind: ')+m.c.replace(/\[\[foto:[^\]]*\]\]\n?/g,'')).join('\n\n');if(navigator.share)try{await navigator.share({title:ch.title,text:t})}catch(x){}else toast(await copyText(t)?'Chat disalin':'Gagal menyalin')}
 else if(a==='sl')toast(await copyText(location.href)?'Tautan disalin':'Gagal menyalin');
 else if(a==='se')$('exp').click();
 else if(a==='pa'){const n=$('pn').value.trim();if(!n){toast('Isi nama proyek');return}X.proj.push({id:uid2(),n,i:$('pi').value.trim()});sv();rr()}
 else if(a==='p0'){X.ap=null;sv();rr()}
 else if(a==='pu'){X.ap=i;sv();toast('Proyek aktif');rr()}
 else if(a==='pd'){X.proj=X.proj.filter(p=>p.id!==i);if(X.ap===i)X.ap=null;sv();rr()}
 else if(a==='out'){if(!confirm('Keluar akun di perangkat ini?'))return;S.set.keys={};if($('xall').checked){S.chats=[];S.cur=null;S.st={i:0,o:0}}save();try{localStorage.removeItem(K)}catch(x){}location.reload()}}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{if(cv==='suara'&&xp.classList.contains('on'))rr()};
})();
</script>
