<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaMind AI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1f;--bg2:#141733;--bg3:#1c2047;--tx:#eceefb;--mu:#9296bd;--ac:#f2b84b;--ac2:#8f7cff;--bd:#2a2e5c;--ub:#2b2f6b;--cd:#0a0b17;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fs:15px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f5fb;--bg2:#fff;--bg3:#ebe9f7;--tx:#1b1c33;--mu:#6b6e93;--ac:#c9871a;--ac2:#5b45e6;--bd:#d9d6ee;--ub:#e2defb;--cd:#f0eefa}}
:root[data-theme="light"]{--bg:#f6f5fb;--bg2:#fff;--bg3:#ebe9f7;--tx:#1b1c33;--mu:#6b6e93;--ac:#c9871a;--ac2:#5b45e6;--bd:#d9d6ee;--ub:#e2defb;--cd:#f0eefa}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.6 Sora,system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{display:flex;height:100%}
#side{width:272px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.logo{display:flex;align-items:center;gap:10px;padding:16px;font-weight:700;font-size:18px}
.star{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#14152b;font-size:16px}
.btn{padding:9px 14px;border-radius:10px;background:var(--bg3);border:1px solid var(--bd)}
.btn:hover{border-color:var(--ac2)}
.pri{background:linear-gradient(135deg,var(--ac),#e08a3c);color:#1a1405;font-weight:600;border:0}
#side .btn.pri{margin:0 14px 10px}
#list{flex:1;overflow-y:auto;padding:0 8px}
.it{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;color:var(--mu)}
.it:hover,.it.on{background:var(--bg3);color:var(--tx)}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.it b{font-weight:400;opacity:.6}.it b:hover{opacity:1;color:#ff7a7a}
.stat{padding:12px 16px;border-top:1px solid var(--bd);font-size:12px;color:var(--mu);display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stat strong{color:var(--tx)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--bg2)}
header h2{margin:0;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{display:none}
select{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:150px}
#msgs{flex:1;overflow-y:auto;padding:20px 14px}
.w{max-width:760px;margin:0 auto}
.m{display:flex;gap:10px;margin-bottom:18px}
.av{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;background:var(--bg3);font-size:15px}
.m.a .av{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.bub{min-width:0;flex:1}
.m.u{flex-direction:row-reverse}
.m.u .bub{flex:none;max-width:85%;background:var(--ub);padding:9px 14px;border-radius:14px 4px 14px 14px;white-space:pre-wrap;word-wrap:break-word}
.m.a .bub{word-wrap:break-word}
.bub p{margin:0 0 .7em}.bub ul,.bub ol{margin:.3em 0 .8em;padding-left:1.4em}
.bub h3,.bub h4{margin:.9em 0 .4em}
.bub code{background:var(--cd);padding:1px 6px;border-radius:5px;font-size:.88em}
.bub pre{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;overflow-x:auto;margin:.6em 0}
.bub pre code{background:none;padding:0}
.act{display:flex;gap:12px;font-size:12px;color:var(--mu);margin-top:4px}
.act button{color:var(--mu)}.act button:hover{color:var(--ac)}
.dots::after{content:"●●●";letter-spacing:3px;color:var(--ac);animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
.empty{text-align:center;padding:8vh 0 0}
.empty h1{font-size:26px;margin:14px 0 6px}.empty p{color:var(--mu);margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{padding:9px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--bg2);font-size:13px}
.chips button:hover{border-color:var(--ac)}
#bar{padding:10px 14px 14px;background:var(--bg)}
.box{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:8px}
.box:focus-within{border-color:var(--ac2)}
textarea{flex:1;background:none;border:0;resize:none;outline:0;max-height:160px;padding:6px 8px}
.send{width:40px;height:40px;border-radius:12px;flex-shrink:0}
.note{max-width:760px;margin:6px auto 0;text-align:center;font-size:11px;color:var(--mu)}
#ov{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:90%;overflow-y:auto}
.modal h3{margin:0 0 14px}.modal label{display:block;margin:12px 0 4px;font-size:13px;color:var(--mu)}
.modal select,.modal textarea,.modal input[type=range]{width:100%;max-width:none}
.modal textarea{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:80px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--ac);padding:8px 16px;border-radius:20px;font-size:13px;z-index:30;display:none}
@media (max-width:760px){
#side{position:fixed;left:-290px;top:0;bottom:0;z-index:15;transition:left .2s;padding-top:env(safe-area-inset-top,0px)}
#side.on{left:0;box-shadow:0 0 0 100vmax #0008}
#menu{display:block}
}

.hide{display:none!important}#app.off{display:none}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:grid;place-items:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.gc{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--bd);border-radius:22px;padding:26px 22px;box-shadow:0 20px 60px #0006}
.gc h1{font-size:21px;margin:12px 0 2px;text-align:center}.gc .gs{color:var(--mu);font-size:13px;text-align:center;margin:0 0 18px}
.gc .star{width:54px;height:54px;border-radius:16px;font-size:26px;margin:0 auto}
.gt{display:grid;grid-template-columns:1fr 1fr;background:var(--bg3);border-radius:12px;padding:4px;margin-bottom:14px}
.gt button{padding:9px;border-radius:9px;color:var(--mu);font-weight:600;font-size:14px}.gt button.on{background:var(--bg2);color:var(--ac)}
.gc label{display:block;font-size:12px;color:var(--mu);margin:11px 0 5px}
.gf{position:relative}.gf input{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--bd);background:var(--bg3);outline:0}
.gf input:focus{border-color:var(--ac2)}.gf .ey{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px;font-size:16px}
.gb{height:5px;border-radius:5px;background:var(--bd);margin-top:7px;overflow:hidden}.gb i{display:block;height:100%;width:0;transition:.3s}
.gh{font-size:12px;color:var(--mu);min-height:16px;margin-top:3px}
.gk{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu);margin-top:12px}.gk label{margin:0;display:flex;gap:8px;align-items:center}
.ge{color:#ff7a7a;font-size:13px;text-align:center;min-height:18px;margin-top:10px}
.gc .btn.pri{width:100%;margin-top:12px;padding:12px}
.um{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--bd)}
.ua{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:700;color:#14152b;flex-shrink:0}
.un{flex:1;min-width:0;line-height:1.3}.un b,.un small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.un small{color:var(--mu);font-size:11px}
.um .btn{padding:6px 10px;font-size:12px}
</style>
</head>
<body>
<div id="gate"><div class="gc">
 <div class="star">✦</div><h1 id="gh1">Masuk ke NovaMind</h1><p class="gs" id="gsub">Chat dan pengaturanmu tersimpan per akun</p>
 <div class="gt"><button id="tL" class="on">Masuk</button><button id="tR">Daftar</button></div>
 <form id="fL" onsubmit="return false" novalidate>
  <label>Email</label><div class="gf"><input type="email" id="lE" placeholder="nama@email.com" autocomplete="username"></div>
  <label>Kata sandi</label><div class="gf"><input type="password" id="lP" placeholder="••••••••" autocomplete="current-password"><button type="button" class="ey" data-t="lP">👁️</button></div>
  <div class="gk"><label><input type="checkbox" id="lR" checked> Ingat saya</label></div>
  <div class="ge" id="eL"></div><button class="btn pri" id="bL">Masuk</button>
 </form>
 <form id="fR" class="hide" onsubmit="return false" novalidate>
  <label>Nama lengkap</label><div class="gf"><input type="text" id="rN" placeholder="Nama kamu" autocomplete="name"></div>
  <label>Email</label><div class="gf"><input type="email" id="rE" placeholder="nama@email.com" autocomplete="email"></div>
  <label>Kata sandi</label><div class="gf"><input type="password" id="rP" placeholder="Minimal 8 karakter" autocomplete="new-password"><button type="button" class="ey" data-t="rP">👁️</button></div>
  <div class="gb"><i id="sb"></i></div><div class="gh" id="sh"></div>
  <label>Ulangi kata sandi</label><div class="gf"><input type="password" id="rC" placeholder="Ketik ulang" autocomplete="new-password"><button type="button" class="ey" data-t="rC">👁️</button></div>
  <div class="gk"><label><input type="checkbox" id="rA"> Saya setuju dengan syarat &amp; ketentuan</label></div>
  <div class="ge" id="eR"></div><button class="btn pri" id="bR">Buat Akun</button>
 </form>
 <div class="gh" style="text-align:center;margin-top:14px">Data tersimpan di perangkat ini. Kata sandi di-hash SHA-256.</div>
</div></div>
<div id="app" class="off">
<aside id="side">
 <div class="logo"><div class="star">✦</div>NovaMind AI</div>
 <button class="btn pri" id="nw">Chat baru</button>
 <div id="list"></div>
 <div class="um"><div class="ua" id="ua">K</div><div class="un"><b id="un"></b><small id="ue"></small></div><button class="btn" id="lo">Keluar</button></div>
 <div class="stat"><span>Pesan <strong id="s1">0</strong></span><span>Chat <strong id="s2">0</strong></span><span>Token masuk <strong id="s3">0</strong></span><span>Token keluar <strong id="s4">0</strong></span></div>
</aside>
<section id="main">
 <header>
  <button class="btn" id="menu" aria-label="Buka riwayat">☰</button>
  <h2 id="ttl">Chat baru</h2>
  <select id="per" aria-label="Persona"></select>
  <button class="btn" id="exp" aria-label="Ekspor chat">Ekspor</button>
  <button class="btn" id="stn" aria-label="Pengaturan">⚙</button>
 </header>
 <div id="msgs"><div class="w" id="w"></div></div>
 <div id="bar">
  <div class="box">
   <textarea id="inp" rows="1" placeholder="Tulis pesan untuk NovaMind…"></textarea>
   <button class="btn pri send" id="snd" aria-label="Kirim">➤</button>
  </div>
  <div class="note" id="nt">Token dihitung perkiraan. Jawaban AI bisa keliru, periksa hal penting.</div>
 </div>
</section>
</div>
<div id="ov"><div class="modal">
 <h3>Pengaturan</h3>
 <label>Mode model</label>
 <select id="tier"><option value="quick">Cepat</option><option value="default">Seimbang</option><option value="complex">Mendalam</option></select>
 <label>Tema</label>
 <select id="th"><option value="auto">Ikuti perangkat</option><option value="dark">Gelap</option><option value="light">Terang</option></select>
 <label>Ukuran huruf: <span id="fsv"></span>px</label>
 <input type="range" id="fs" min="13" max="19">
 <label>Instruksi tambahan (berlaku di semua persona)</label>
 <textarea id="cus" placeholder="Contoh: Jawab singkat dan pakai bahasa santai."></textarea>
 <label><input type="checkbox" id="ent"> Enter untuk kirim (Shift+Enter baris baru)</label>
 <button class="btn" id="dac" style="margin-top:14px;color:#ff7a7a">Hapus akun</button>
 <div class="row"><button class="btn" id="rst">Hapus semua data</button><button class="btn pri" id="cls">Selesai</button></div>
</div></div>
<div id="toast"></div>
<script>
const P=[
{id:'umum',n:'Asisten Umum',i:'✦',p:'Kamu NovaMind, asisten AI yang ramah dan jelas. Jawab dalam bahasa pengguna, default Bahasa Indonesia.',s:['Jelaskan cara kerja blockchain','Buatkan rencana belajar 7 hari','Ide bisnis modal kecil']},
{id:'dev',n:'Programmer',i:'⌨',p:'Kamu programmer senior. Beri kode yang berjalan, ringkas, dengan blok kode dan penjelasan singkat. Bahasa Indonesia.',s:['Buat fungsi debounce di JavaScript','Jelaskan async/await','Cara membuat Roblox LocalScript tombol UI']},
{id:'tulis',n:'Penulis Kreatif',i:'✎',p:'Kamu penulis kreatif berbakat. Tulis dengan gaya hidup dan imajinatif dalam Bahasa Indonesia.',s:['Tulis cerpen 200 kata tentang hujan','Buat caption Instagram kopi','Puisi tentang rindu']},
{id:'guru',n:'Guru Sabar',i:'☘',p:'Kamu guru yang sabar. Jelaskan bertahap dengan analogi dan contoh sederhana, lalu beri satu soal latihan. Bahasa Indonesia.',s:['Ajari aku pecahan','Apa itu fotosintesis?','Jelaskan hukum Newton']},
{id:'trans',n:'Penerjemah',i:'⇄',p:'Kamu penerjemah profesional. Terjemahkan teks pengguna antara Indonesia dan Inggris (deteksi otomatis), tanpa komentar tambahan kecuali diminta.',s:['Terjemahkan: Selamat pagi, apa kabar?','Translate: See you tomorrow']},
{id:'bisnis',n:'Analis Bisnis',i:'▦',p:'Kamu konsultan bisnis tajam. Beri analisis terstruktur, angka masuk akal, dan langkah praktis. Bahasa Indonesia.',s:['Analisis SWOT warung kopi','Strategi harga produk digital','Tips menaikkan konversi toko online']}];
const $=id=>document.getElementById(id);
let S={chats:[],cur:null,set:{tier:'default',custom:'',size:15,theme:'auto',enter:true},st:{i:0,o:0}};
let KEY='nm1';
const save=()=>{if(KEY==='nm1')return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let sample=null,busy=false,ctl=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const cur=()=>S.chats.find(c=>c.id===S.cur);
const tok=t=>Math.ceil((t||'').length/4);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}
function md(s){
 const bl=[];s=esc(s).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{bl.push(c.replace(/\n$/,''));return '\u0000'+(bl.length-1)+'\u0000'});
 s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');
 const out=[];let ul=null;
 for(const ln of s.split('\n')){
  let m;
  if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(ul!=='ul'){out.push(ul?'</'+ul+'>':'','<ul>');ul='ul'}out.push('<li>'+m[1]+'</li>')}
  else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(ul!=='ol'){out.push(ul?'</'+ul+'>':'','<ol>');ul='ol'}out.push('<li>'+m[1]+'</li>')}
  else{if(ul){out.push('</'+ul+'>');ul=null}
   if(m=ln.match(/^#{1,2}\s+(.*)/))out.push('<h3>'+m[1]+'</h3>');else if(m=ln.match(/^#{3,}\s+(.*)/))out.push('<h4>'+m[1]+'</h4>');
   else if(ln.trim())out.push('<p>'+ln+'</p>')}
 }
 if(ul)out.push('</'+ul+'>');
 return out.join('').replace(/\u0000(\d+)\u0000/g,(_,i)=>'<pre><code>'+bl[i]+'</code></pre>').replace(/<p>(<pre>[\s\S]*?<\/pre>)<\/p>/g,'$1');
}
function render(){
 const c=cur(),w=$('w');
 $('ttl').textContent=c?c.title:'Chat baru';
 $('per').value=c?c.persona:($('per').value||'umum');
 const pe=P.find(p=>p.id===$('per').value)||P[0];
 if(!c||!c.msgs.length){
  w.innerHTML='<div class="empty"><div class="star" style="width:56px;height:56px;font-size:28px;margin:0 auto;border-radius:16px">'+pe.i+'</div><h1>'+pe.n+'</h1><p>Tanya apa saja, atau pilih salah satu ide ini.</p><div class="chips">'+pe.s.map(x=>'<button>'+esc(x)+'</button>').join('')+'</div></div>';
  w.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>send(b.textContent));
 }else{
  w.innerHTML=c.msgs.map((m,i)=>'<div class="m '+m.r+'"><div class="av">'+(m.r==='u'?'☺':pe.i)+'</div><div class="bub">'+(m.r==='u'?esc(m.c):(m.c?md(m.c):'<span class="dots"></span>'))+(m.r==='a'&&m.c&&!(busy&&i===c.msgs.length-1)?'<div class="act"><button data-a="cp" data-i="'+i+'">Salin</button>'+(i===c.msgs.length-1?'<button data-a="rg">Ulangi</button>':'')+'</div>':'')+'</div></div>').join('');
 }
 stats();list();
 const sc=$('msgs');sc.scrollTop=sc.scrollHeight;
}
function stats(){$('s1').textContent=S.chats.reduce((a,c)=>a+c.msgs.length,0);$('s2').textContent=S.chats.length;$('s3').textContent=S.st.i.toLocaleString('id-ID');$('s4').textContent=S.st.o.toLocaleString('id-ID')}
function list(){
 $('list').innerHTML=S.chats.slice().sort((a,b)=>b.t-a.t).map(c=>'<div class="it'+(c.id===S.cur?' on':'')+'"><span data-id="'+c.id+'">'+esc(c.title)+'</span><b data-del="'+c.id+'" role="button" aria-label="Hapus">✕</b></div>').join('')||'<div class="it">Belum ada riwayat</div>';
}
function newChat(){S.cur=null;render();$('side').classList.remove('on');$('inp').focus()}
async function ask(c){
 const pe=P.find(p=>p.id===c.persona)||P[0];
 const hist=c.msgs.slice(0,-1).map(m=>({role:m.r==='u'?'user':'assistant',content:m.c}));
 hist[0].content='[Instruksi sistem: '+pe.p+(S.set.custom?' Instruksi tambahan pengguna: '+S.set.custom:'')+']\n\n'+hist[0].content;
 const a=c.msgs[c.msgs.length-1];busy=true;ctl=new AbortController();setBtn();
 const inTok=hist.reduce((n,m)=>n+tok(m.content),0);
 try{
  await sample(hist,{cache:false,signal:ctl.signal,modelTier:S.set.tier,onText:({text})=>{a.c=text;patch(a)}});
 }catch(e){
  if(e&&e.code==='not_granted')a.c=a.c||'Izin AI belum diberikan. Muat ulang halaman lalu setujui permintaan akses.';
  else if(e&&e.code==='rate_limited')a.c=a.c||'Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.';
  else if(!(ctl&&ctl.signal.aborted))a.c=a.c||'Gagal mendapat jawaban. Periksa koneksi lalu tekan Ulangi.';
  if(e&&e.text)a.c=e.text;
 }
 S.st.i+=inTok;S.st.o+=tok(a.c);busy=false;ctl=null;setBtn();save();render();
}
function patch(a){const c=cur();if(!c)return;const els=$('w').querySelectorAll('.m.a .bub');const el=els[els.length-1];if(el){el.innerHTML=md(a.c);const sc=$('msgs');sc.scrollTop=sc.scrollHeight}}
function setBtn(){$('snd').textContent=busy?'■':'➤'}
async function send(t){
 t=(t||'').trim();if(!t||busy)return;
 if(!sample){toast('Fitur AI tidak tersedia di tampilan ini');return}
 let c=cur();
 if(!c){c={id:uid(),title:t.slice(0,32),persona:$('per').value||'umum',msgs:[],t:Date.now()};S.chats.push(c);S.cur=c.id}
 c.msgs.push({r:'u',c:t},{r:'a',c:''});c.t=Date.now();
 $('inp').value='';grow();render();ask(c);
}
function grow(){const i=$('inp');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,160)+'px'}
$('snd').onclick=()=>busy?ctl&&ctl.abort():send($('inp').value);
$('inp').oninput=grow;
$('inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&S.set.enter&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send($('inp').value)}};
$('nw').onclick=newChat;
$('menu').onclick=()=>$('side').classList.toggle('on');
$('list').onclick=e=>{const d=e.target.dataset;if(d.id){S.cur=d.id;save();render();$('side').classList.remove('on')}
 if(d.del){S.chats=S.chats.filter(c=>c.id!==d.del);if(S.cur===d.del)S.cur=null;save();render()}};
$('w').onclick=async e=>{const a=e.target.dataset.a,c=cur();if(!c)return;
 if(a==='cp'){try{await navigator.clipboard.writeText(c.msgs[+e.target.dataset.i].c);toast('Tersalin')}catch(x){toast('Gagal menyalin')}}
 if(a==='rg'&&!busy){const l=c.msgs[c.msgs.length-1];l.c='';render();ask(c)}};
$('per').onchange=()=>{const c=cur();if(c){c.persona=$('per').value;save()}render()};
$('exp').onclick=async()=>{const c=cur();if(!c||!c.msgs.length){toast('Belum ada chat untuk diekspor');return}
 const txt='# '+c.title+'\n\n'+c.msgs.map(m=>(m.r==='u'?'**Kamu:** ':'**NovaMind:** ')+m.c).join('\n\n');
 try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:'novamind-chat.md',data:txt})}
 catch(e){try{await navigator.clipboard.writeText(txt);toast('Chat disalin ke clipboard')}catch(x){toast('Ekspor tidak tersedia')}}};
function applySet(){
 const s=S.set;document.documentElement.style.setProperty('--fs',s.size+'px');
 if(s.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',s.theme);
 $('tier').value=s.tier;$('th').value=s.theme;$('fs').value=s.size;$('fsv').textContent=s.size;$('cus').value=s.custom;$('ent').checked=s.enter;
}
$('stn').onclick=()=>$('ov').classList.add('on');
$('cls').onclick=()=>$('ov').classList.remove('on');
$('ov').onclick=e=>{if(e.target===$('ov'))$('ov').classList.remove('on')};
[['tier','tier'],['th','theme'],['cus','custom']].forEach(([i,k])=>$(i).onchange=()=>{S.set[k]=$(i).value;applySet();save()});
$('fs').oninput=()=>{S.set.size=+$('fs').value;applySet();save()};
$('ent').onchange=()=>{S.set.enter=$('ent').checked;save()};
$('rst').onclick=()=>{if(confirm('Hapus semua chat dan statistik?')){S.chats=[];S.cur=null;S.st={i:0,o:0};save();render();$('ov').classList.remove('on')}};
$('per').innerHTML=P.map(p=>'<option value="'+p.id+'">'+p.i+' '+p.n+'</option>').join('');
/* ===== AUTH ===== */
const mem={};
const ST={get(k,x){try{return(x?sessionStorage:localStorage).getItem(k)}catch(e){return mem[k]??null}},set(k,v,x){try{(x?sessionStorage:localStorage).setItem(k,v)}catch(e){mem[k]=v}},del(k,x){try{(x?sessionStorage:localStorage).removeItem(k)}catch(e){delete mem[k]}}};
const users=()=>{try{return JSON.parse(ST.get('kz_users')||'{}')}catch(e){return{}}};
const saveU=u=>ST.set('kz_users',JSON.stringify(u));
async function hash(p,sl){
 if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(sl+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 let x=0;for(const c of sl+p)x=(x*31+c.charCodeAt(0))|0;return'f'+x}
const salt=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const DEF=()=>({chats:[],cur:null,set:{tier:'default',custom:'',size:15,theme:'auto',enter:true},st:{i:0,o:0}});
let me=null;
function enter(a){
 me=a;KEY='nm1_'+a.email;S=DEF();
 try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
 $('gate').classList.add('hide');$('app').classList.remove('off');
 $('ua').textContent=a.name[0].toUpperCase();$('un').textContent=a.name;$('ue').textContent=a.email;
 applySet();render();}
function leave(){
 me=null;KEY='nm1';S=DEF();ST.del('kz_sess');ST.del('kz_sess',true);
 $('app').classList.add('off');$('side').classList.remove('on');$('gate').classList.remove('hide');
 tab(false);$('lP').value='';}
function tab(r){
 $('tL').classList.toggle('on',!r);$('tR').classList.toggle('on',r);
 $('fL').classList.toggle('hide',r);$('fR').classList.toggle('hide',!r);
 $('gh1').textContent=r?'Buat akun NovaMind':'Masuk ke NovaMind';
 $('gsub').textContent=r?'Daftar gratis dalam hitungan detik':'Chat dan pengaturanmu tersimpan per akun';
 $('eL').textContent=$('eR').textContent='';}
$('tL').onclick=()=>tab(false);$('tR').onclick=()=>tab(true);
document.querySelectorAll('.ey').forEach(b=>b.onclick=()=>{const i=$(b.dataset.t);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁️':'🙈'});
$('rP').oninput=e=>{const p=e.target.value;let n=0;
 if(p.length>=8)n++;if(p.length>=12)n++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))n++;if(/\d/.test(p))n++;if(/[^\w\s]/.test(p))n++;
 const L=[['Terlalu lemah','#dc2626'],['Lemah','#ea580c'],['Cukup','#ca8a04'],['Bagus','#65a30d'],['Kuat','#16a34a'],['Sangat kuat','#16a34a']][p?n:0];
 $('sb').style.width=p?(n/5*100)+'%':'0';$('sb').style.background=L[1];$('sh').textContent=p?L[0]:'';};
$('bR').onclick=async()=>{
 const n=$('rN').value.trim(),e=$('rE').value.trim().toLowerCase(),p=$('rP').value,er=$('eR');
 if(n.length<2)return er.textContent='Nama minimal 2 karakter';
 if(!emailOk(e))return er.textContent='Format email tidak valid';
 if(p.length<8)return er.textContent='Kata sandi minimal 8 karakter';
 if(p!==$('rC').value)return er.textContent='Konfirmasi kata sandi tidak cocok';
 if(!$('rA').checked)return er.textContent='Centang persetujuan terlebih dahulu';
 const u=users();if(u[e])return er.textContent='Email sudah terdaftar, silakan masuk';
 $('bR').disabled=true;const sl=salt();
 u[e]={name:n,email:e,salt:sl,hash:await hash(p,sl),created:Date.now()};
 saveU(u);$('bR').disabled=false;$('fR').reset();$('sb').style.width='0';$('sh').textContent='';
 ST.set('kz_sess',e,true);enter(u[e]);toast('Akun dibuat. Selamat datang, '+n.split(' ')[0]+'!');};
let fails=0,lock=0;
$('bL').onclick=async()=>{
 const e=$('lE').value.trim().toLowerCase(),p=$('lP').value,er=$('eL');
 if(Date.now()<lock)return er.textContent='Terlalu banyak percobaan. Tunggu '+Math.ceil((lock-Date.now())/1000)+' detik';
 if(!emailOk(e)||!p)return er.textContent='Isi email dan kata sandi dengan benar';
 $('bL').disabled=true;const a=users()[e];const ok=a&&(await hash(p,a.salt))===a.hash;$('bL').disabled=false;
 if(!ok){if(++fails>=5){lock=Date.now()+30000;fails=0}return er.textContent='Email atau kata sandi salah'}
 fails=0;er.textContent='';ST.del('kz_sess');ST.del('kz_sess',true);ST.set('kz_sess',e,!$('lR').checked);
 $('fL').reset();enter(a);toast('Selamat datang, '+a.name.split(' ')[0]+'!');};
[['lE','bL'],['lP','bL'],['rC','bR']].forEach(([i,b])=>$(i).addEventListener('keydown',ev=>{if(ev.key==='Enter')$(b).click()}));
$('lo').onclick=leave;
$('dac').onclick=()=>{
 if(!me||!confirm('Hapus akun beserta semua chat secara permanen?'))return;
 const u=users();delete u[me.email];saveU(u);try{localStorage.removeItem(KEY)}catch(e){}
 $('ov').classList.remove('on');leave();toast('Akun dihapus');};
/* ===== END AUTH ===== */
applySet();render();
{const e=ST.get('kz_sess',true)||ST.get('kz_sess'),a=e&&users()[e];if(a)enter(a)}
(async()=>{try{sample=await claude.use('sample')}catch(e){}
 if(!sample)$('nt').textContent='Fitur AI aktif hanya saat halaman dibuka lewat claude.ai.'})();
</script>
</body>
</html>
