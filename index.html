<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaMind AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#070816">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070816;--gl:rgba(22,24,54,.62);--gl2:rgba(255,255,255,.06);--tx:#eef0ff;--mu:#9a9fcf;--ac:#f6b94c;--ac2:#8b7bff;--ac3:#35d6e8;--bd:rgba(255,255,255,.1);--ub:linear-gradient(135deg,#5b49e8,#8b7bff);--cd:rgba(0,0,0,.35);--fs:15px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f0fb;--gl:rgba(255,255,255,.72);--gl2:rgba(60,50,140,.07);--tx:#1b1c33;--mu:#666a94;--ac:#d38b10;--ac2:#5b45e6;--ac3:#0aa5b8;--bd:rgba(40,40,110,.14);--cd:rgba(40,40,110,.07)}}
:root[data-theme="light"]{--bg:#f1f0fb;--gl:rgba(255,255,255,.72);--gl2:rgba(60,50,140,.07);--tx:#1b1c33;--mu:#666a94;--ac:#d38b10;--ac2:#5b45e6;--ac3:#0aa5b8;--bd:rgba(40,40,110,.14);--cd:rgba(40,40,110,.07)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.65 Sora,system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(40vmax 40vmax at 8% 0%,color-mix(in srgb,var(--ac2) 38%,transparent),transparent),radial-gradient(35vmax 35vmax at 100% 20%,color-mix(in srgb,var(--ac3) 22%,transparent),transparent),radial-gradient(40vmax 30vmax at 50% 110%,color-mix(in srgb,var(--ac) 18%,transparent),transparent)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac3);outline-offset:2px}
#app{position:relative;z-index:1;display:flex;height:100%}
#side{width:278px;background:var(--gl);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.logo{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;font-weight:700;font-size:18px}
.star{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#14152b;box-shadow:0 6px 20px color-mix(in srgb,var(--ac2) 50%,transparent)}
.btn{padding:9px 14px;border-radius:12px;background:var(--gl2);border:1px solid var(--bd);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ac2)}
.pri{background:linear-gradient(135deg,var(--ac),#ea8a3a);color:#1a1405;font-weight:600;border:0}
#side .pri{margin:0 14px 12px}
#list{flex:1;overflow-y:auto;padding:0 8px}
.it{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:12px;color:var(--mu)}
.it:hover,.it.on{background:var(--gl2);color:var(--tx)}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-size:14px}
.it b{font-weight:400;opacity:.55}.it b:hover{opacity:1;color:#ff7a7a}
.stat{display:none!important;margin:10px;padding:12px;border-radius:14px;background:var(--gl2);font-size:12px;color:var(--mu);display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stat strong{color:var(--tx)}
header{display:flex;align-items:center;gap:8px;padding:12px 14px}
header h2{margin:0;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{display:none}
.pill{display:flex;align-items:center;gap:7px;max-width:190px;padding:7px 12px;border-radius:20px;background:var(--gl);border:1px solid var(--bd);font-size:12.5px;backdrop-filter:blur(14px)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ac3);box-shadow:0 0 10px var(--ac3);flex-shrink:0}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{background:var(--gl2);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;max-width:150px}
select option{color:#111}
#msgs{flex:1;overflow-y:auto;padding:10px 14px 20px}
.w{max-width:780px;margin:0 auto}
.m{display:flex;gap:11px;margin-bottom:22px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.av{width:32px;height:32px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;background:var(--gl2);font-size:15px}
.m.a .av{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#14152b}
.bub{min-width:0;flex:1}
.m.u{flex-direction:row-reverse}
.m.u .bub{flex:none;max-width:85%;background:var(--ub);color:#fff;padding:10px 15px;border-radius:18px 5px 18px 18px;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 8px 24px rgba(91,73,232,.3)}
.m.a .bub{word-wrap:break-word}
.bub p{margin:0 0 .7em}.bub ul,.bub ol{margin:.3em 0 .8em;padding-left:1.4em}.bub h3,.bub h4{margin:.9em 0 .4em}
.bub code{background:var(--cd);padding:1px 6px;border-radius:6px;font-size:.88em}
.bub pre{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:13px;overflow-x:auto;margin:.6em 0}
.bub pre code{background:none;padding:0}
.cb{margin:.7em 0;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--cd)}
.cb .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px 5px 13px;font-size:11.5px;color:var(--mu);border-bottom:1px solid var(--bd);background:var(--gl2)}
.cb .hd button{color:var(--mu);font-size:11.5px;padding:3px 8px;border-radius:8px}
.cb .hd button:hover{color:var(--ac)}
.bub .cb pre{margin:0;border:0;border-radius:0;background:none}
.err{color:#ff8a8a}
.act{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:4px}
.act button{color:var(--mu)}.act button:hover{color:var(--ac)}
.dots::after{content:"●●●";letter-spacing:3px;color:var(--ac3);animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots::after,.m{animation:none}}
.empty{text-align:center;padding:7vh 0 0}
.empty h1{font-size:30px;margin:16px 0 6px;background:linear-gradient(90deg,var(--tx),var(--ac3));-webkit-background-clip:text;background-clip:text;color:transparent}
.empty p{color:var(--mu);margin:0 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chips button{padding:10px 15px;border-radius:22px;border:1px solid var(--bd);background:var(--gl);font-size:13px;backdrop-filter:blur(12px)}
.chips button:hover{border-color:var(--ac3)}
#bar{padding:6px 14px 14px;position:relative}
#dn{display:none;position:absolute;right:20px;top:-46px;width:38px;height:38px;border-radius:50%;padding:0;z-index:4;background:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:18px;line-height:1}
.box{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--gl);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:24px;padding:8px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.box:focus-within{border-color:var(--ac2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac2) 28%,transparent)}
textarea{flex:1;background:none;border:0;resize:none;outline:0;max-height:160px;padding:8px 10px}
.send{width:42px;height:42px;border-radius:50%;flex-shrink:0;padding:0}
.note{max-width:780px;margin:7px auto 0;text-align:center;font-size:11px;color:var(--mu)}
#ov{display:none;position:fixed;inset:0;background:#0009;backdrop-filter:blur(4px);z-index:20;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
.modal{background:var(--bg);border:1px solid var(--bd);border-radius:22px;padding:20px;width:100%;max-width:480px;max-height:92%;overflow-y:auto}
.modal h3{margin:0 0 12px}.modal label{display:block;margin:13px 0 5px;font-size:13px;color:var(--mu)}
.modal select,.modal input[type=text],.modal input[type=password],.modal input[type=range],.modal textarea{width:100%;max-width:none}
.modal input[type=text],.modal input[type=password],.modal textarea{background:var(--gl2);border:1px solid var(--bd);border-radius:12px;padding:10px}
.modal textarea{min-height:70px}
.pvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{padding:10px;border-radius:14px;border:1px solid var(--bd);background:var(--gl2);text-align:left;font-size:13px}
.pv small{display:block;color:var(--mu);font-size:11px}
.pv.on{border-color:var(--ac3);background:color-mix(in srgb,var(--ac3) 14%,transparent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.hint{font-size:11.5px;color:var(--mu);margin-top:5px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--bg);border:1px solid var(--ac3);padding:8px 16px;border-radius:22px;font-size:13px;z-index:60;display:none;max-width:90%}
@media (max-width:760px){
#side{position:fixed;left:-300px;top:0;bottom:0;z-index:15;transition:left .2s;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
#side.on{left:0;box-shadow:0 0 0 100vmax #0008}
#menu{display:block}
select{max-width:110px}
}
.box{position:relative}
.ic{width:40px;height:40px;border-radius:50%;padding:0;flex-shrink:0;display:grid;place-items:center;font-size:22px;line-height:1}
#mic.rec{background:#e5484d;border-color:#e5484d;color:#fff;animation:pu 1.2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 8px rgba(229,72,77,.25)}}
@media (prefers-reduced-motion:reduce){#mic.rec{animation:none}}
#atts{max-width:780px;margin:0 auto 6px;display:flex;gap:8px;overflow-x:auto}
#atts:empty{display:none}
.ch{display:flex;align-items:center;gap:6px;background:var(--gl);border:1px solid var(--bd);border-radius:14px;padding:5px 9px;font-size:12px;flex-shrink:0}
.ch img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.ch span{font-weight:700;font-size:10px;color:var(--ac3)}
.ch em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.ch b{cursor:pointer;opacity:.6;padding:2px}
#pm{display:none;position:absolute;left:0;bottom:calc(100% + 10px);background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:6px;min-width:190px;z-index:5;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#pm.on{display:block}
#pm button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
#pm button:hover{background:var(--gl2)}
.at{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.at img{max-width:150px;max-height:130px;border-radius:12px}
.fc{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:10px;font-size:12px}
#cam{display:none;position:fixed;inset:0;background:#000c;z-index:25;align-items:center;justify-content:center;padding:16px}
#cam.on{display:flex}
.cm{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:14px;max-width:520px;width:100%}
#vid{width:100%;border-radius:14px;background:#000}
#sbk{display:none;margin-left:auto;padding:7px 12px;font-size:13px;font-weight:400}
@media (max-width:760px){#sbk{display:block}}
html,body{max-width:100%;overflow-x:hidden}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#main,#msgs,.w{min-width:0}
.bub{overflow-wrap:anywhere}
@media (max-width:760px){
header{flex-wrap:wrap;gap:6px 8px;padding:10px 12px}
header h2{min-width:0;font-size:14px}
header .btn{padding:8px 11px}
#pl{order:5;flex:1 1 0;max-width:none;min-width:0}
#per{order:6;flex:1 1 0;max-width:none;min-width:0}
#msgs{padding:8px 12px 16px}
#bar{padding:6px 10px 12px}
.m.u .bub{max-width:88%}
.empty{padding-top:4vh}
}
#uf{display:none!important}
#kf{display:none!important}
body.need-code #kf{display:block!important}
body.auth #app{visibility:hidden}
#au{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
body.auth #au{display:flex}
.acard{width:100%;max-width:380px;margin:auto;background:var(--gl);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--bd);border-radius:24px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.acard h1{margin:14px 0 4px;font-size:26px;text-align:center}
.acard>p{margin:0;text-align:center;color:var(--mu);font-size:13.5px}
.acard label{display:block;margin:13px 0 5px;font-size:13px;color:var(--mu)}
.acard input{width:100%;background:var(--gl2);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;outline:0}
.acard input:focus{border-color:var(--ac2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac2) 28%,transparent)}
.acard .pri{width:100%;margin-top:18px;padding:12px}
.acard .pri:disabled{opacity:.6}
.acard .hint{text-align:center;margin-top:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--gl2);padding:4px;border-radius:14px;margin:18px 0 2px}
.tabs button{padding:9px;border-radius:10px;color:var(--mu)}
.tabs button.on{background:var(--bg);color:var(--tx);font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.pw{position:relative}.pw input{padding-right:76px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mu);padding:6px 8px}
.aerr{color:#ff8a8a;font-size:12.5px;min-height:18px;margin-top:10px}
#usr{display:flex;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}
.ua{width:32px;height:32px;border-radius:50%;background:var(--ub);display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0}
#un{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#lo{padding:6px 11px;font-size:12px}
#q{display:block;margin:0 14px 10px;width:calc(100% - 28px);background:var(--gl2);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;outline:0;font-size:13px}
#q:focus{border-color:var(--ac2)}
.it b[data-ren]:hover{color:var(--ac)}
.m.u .bub.ed{flex:1;max-width:100%}
.ed textarea{width:100%;display:block;background:rgba(255,255,255,.16);border:0;border-radius:10px;color:#fff;padding:8px 10px;min-height:70px;max-height:260px;resize:vertical;outline:0;font:inherit}
.m.u .act{color:rgba(255,255,255,.8);justify-content:flex-end;margin-top:6px}
.m.u .act button{color:inherit}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}
#au_g{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px}
#au_g:disabled{opacity:.6}
</style>
</head>
<body class="auth">
<div id="app">
<aside id="side">
 <div class="logo"><div class="star">✦</div>NovaMind AI<button class="btn" id="sbk" aria-label="Kembali ke chat">← Kembali</button></div>
 <button class="btn pri" id="nw">+ Chat baru</button>
 <input id="q" type="search" placeholder="Cari chat…" aria-label="Cari chat">
 <div id="list"></div>
 <div class="stat"><span>Pesan <strong id="s1">0</strong></span><span>Chat <strong id="s2">0</strong></span><span>Token masuk <strong id="s3">0</strong></span><span>Token keluar <strong id="s4">0</strong></span></div>
 <div id="usr"><div class="ua" id="ua">?</div><span id="un"></span><button class="btn" id="lo">Keluar</button></div>
</aside>
<section id="main">
 <header>
  <button class="btn" id="menu" aria-label="Buka riwayat">☰</button>
  <h2 id="ttl">Chat baru</h2>
  <button class="pill" id="pl" aria-label="Pilih AI"><i></i><span id="pt"></span></button>
  <select id="per" aria-label="Persona"></select>
  <button class="btn" id="exp" aria-label="Ekspor chat">⇩</button>
  <button class="btn" id="stn" aria-label="Pengaturan">⚙</button>
 </header>
 <div id="msgs"><div class="w" id="w"></div></div>
 <div id="bar">
  <button class="btn ic" id="dn" aria-label="Ke pesan terbaru">↓</button>
  <div id="atts"></div>
  <div class="box">
   <div id="pm"><button data-m="cam">&#128247; Kamera</button><button data-m="img">&#128444; Foto / galeri</button><button data-m="file">&#128206; File (teks, PDF)</button></div>
   <button class="btn ic" id="plus" aria-label="Lampirkan">+</button>
   <textarea id="inp" rows="1" placeholder="Tulis pesan untuk NovaMind…"></textarea>
   <button class="btn ic" id="mic" aria-label="Rekam suara"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
   <button class="btn pri send" id="snd" aria-label="Kirim">➤</button>
  </div>
  <input type="file" id="f1" accept="image/*" capture="environment" hidden>
  <input type="file" id="f2" accept="image/*" multiple hidden>
  <input type="file" id="f3" accept=".txt,.md,.csv,.json,.js,.ts,.py,.lua,.html,.css,.xml,.log,.yml,.yaml,.java,.c,.cpp,.cs,.php,.sql,.pdf,text/*,application/pdf" multiple hidden>
  <div class="note">Token dihitung perkiraan. Jawaban AI bisa keliru, periksa hal penting.</div>
 </div>
</section>
</div>
<div id="ov"><div class="modal">
 <div class="mh"><button class="btn" id="bk" aria-label="Kembali">← Kembali</button><h3>Pengaturan AI</h3></div>
 <div class="pvs" id="pvs" style="display:none"></div>
 <div id="kf">
  <label id="kl">Kode akses (opsional)</label>
  <input type="password" id="key" placeholder="Tempel API key di sini" autocomplete="off">
  <div class="hint" id="kh"></div>
 </div>
 <div id="uf"><label>Base URL / alamat proxy</label><input type="text" id="url" placeholder="http://localhost:11434/v1"></div>
 <label>Model</label>
 <select id="mdl" style="max-width:none;width:100%"></select>
 <input type="text" id="mc" placeholder="atau ketik nama model sendiri" style="margin-top:8px">
 <div class="row"><button class="btn" id="tst">Tes koneksi</button><span class="hint" id="tr"></span></div>
 <label>Bahasa rekam suara</label>
 <select id="vl" style="max-width:none;width:100%"><option value="id-ID">Indonesia</option><option value="en-US">English</option></select>
 <label>Tema</label>
 <select id="th" style="max-width:none;width:100%"><option value="auto">Ikuti perangkat</option><option value="dark">Gelap</option><option value="light">Terang</option></select>
 <label>Ukuran huruf: <span id="fsv"></span>px</label>
 <input type="range" id="fs" min="13" max="19">
 <label><input type="checkbox" id="ent"> Enter untuk kirim di desktop</label>
 <label>Data &amp; aplikasi</label>
 <div class="row" style="margin-top:6px"><button class="btn" id="xpj" type="button">Ekspor JSON</button><button class="btn" id="ipj" type="button">Impor JSON</button></div>
 <div class="row" id="pwr" style="margin-top:8px;display:none"><button class="btn" id="pwa" type="button">Pasang aplikasi</button></div>
 <input type="file" id="f4" accept=".json,application/json" hidden>
 <label>Akun: <b id="acn"></b></label>
 <div class="row" style="margin-top:6px"><button class="btn" id="cpb" type="button">Ganti kata sandi</button><button class="btn" id="dab" type="button" style="color:#ff8a8a">Hapus akun</button></div>
 <div id="cpw" style="display:none">
  <label>Kata sandi lama</label><input type="password" id="cp0" autocomplete="current-password">
  <label>Kata sandi baru</label><input type="password" id="cp1" autocomplete="new-password">
  <label>Ulangi kata sandi baru</label><input type="password" id="cp2" autocomplete="new-password">
  <div class="row"><span class="hint" id="cpe"></span><button class="btn pri" id="cps" type="button">Simpan</button></div>
 </div>

function md(s){
 const bl=[];s=esc(s).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{bl.push({l:l,c:c.replace(/\n$/,'')});return '\u0000'+(bl.length-1)+'\u0000'});
 s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');
 const out=[];let ul=null;
 for(const ln of s.split('\n')){
  let m;
  if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(ul!=='ul'){out.push(ul?'</'+ul+'>':'','<ul>');ul='ul'}out.push('<li>'+m[1]+'</li>')}
  else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(ul!=='ol'){out.push(ul?'</'+ul+'>':'','<ol>');ul='ol'}out.push('<li>'+m[1]+'</li>')}
  else{if(ul){out.push('</'+ul+'>');ul=null}
   if(m=ln.match(/^#{1,2}\s+(.*)/))out.push('<h3>'+m[1]+'</h3>');else if(m=ln.match(/^#{3,}\s+(.*)/))out.push('<h4>'+m[1]+'</h4>');
   else if(ln.trim())out.push('<p>'+ln+'</p>')}
 }
 if(ul)out.push('</'+ul+'>');
 return out.join('').replace(/(?:<p>)?\u0000(\d+)\u0000(?:<\/p>)?/g,(_,i)=>{const b=bl[i];return '<div class="cb"><div class="hd"><span>'+(b.l||'kode')+'</span><button data-a="cc">Salin</button></div><pre><code>'+b.c+'</code></pre></div>'});
}

async function sse(res,fn){
 const rd=res.body.getReader(),dc=new TextDecoder();let b='';
 for(;;){const {done,value}=await rd.read();if(done)break;b+=dc.decode(value,{stream:true});const ls=b.split('\n');b=ls.pop();
  for(const l of ls){if(l.startsWith('data:')){const d=l.slice(5).trim();if(d&&d!=='[DONE]'){try{fn(JSON.parse(d))}catch(e){}}}}}
}
async function call(msgs,sys,on,signal){
 const s=S.set,p=pv(),k=(s.keys[s.prov]||'').trim(),m=model();let out='';
 const up=t=>{out=t;on(t)};
 if(p.t==='sample'){
  if(!sample)throw new Error('Claude bawaan hanya tersedia saat dibuka lewat claude.ai. Pilih penyedia lain dan isi API key.');
  const h=msgs.map(x=>({role:x.role,content:x.content}));h[0].content='[Instruksi sistem: '+sys+']\n\n'+h[0].content;
  const r=await sample(h,{cache:false,signal,modelTier:m||'default',onText:({text})=>up(text)});return r.text||out;
 }
 if(!k&&!p.nk&&!p.custom)throw new Error('API key '+p.n+' belum diisi. Buka pengaturan lalu tempel key.');
 if(!m)throw new Error('Pilih atau ketik nama model dulu di pengaturan.');
 let url,hd={'Content-Type':'application/json'},body;
 if(p.t==='an'){url='https://api.anthropic.com/v1/messages';Object.assign(hd,{'x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'});body={model:m,max_tokens:4096,system:sys,messages:msgs.map(x=>({role:x.role,content:anC(x)})),stream:true}}
 else if(p.t==='gm'){url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':streamGenerateContent?alt=sse&key='+encodeURIComponent(k);body={systemInstruction:{parts:[{text:sys}]},contents:msgs.map(x=>({role:x.role==='user'?'user':'model',parts:gmP(x)}))}}
 else{const base=(p.custom?(s.urls[s.prov]||''):p.u).replace(/\/$/,'');if(!base)throw new Error('Isi Base URL dulu di pengaturan.');url=base+'/chat/completions';if(k)hd.Authorization='Bearer '+k;body={model:m,stream:true,messages:[{role:'system',content:sys},...msgs.map(x=>({role:x.role,content:oaC(x)}))]}}
 let res;
 try{res=await fetch(url,{method:'POST',headers:hd,body:JSON.stringify(body),signal})}
 catch(e){if(e.name==='AbortError')throw e;throw new Error('Tidak bisa terhubung ke '+url.split('?')[0]+' ('+(e&&e.message||'diblokir')+'). Penyebab umum: halaman dibuka di dalam claude.ai/pratinjau (koneksi keluar diblokir), server menolak akses dari browser (CORS), atau internet putus. Buka file lewat Chrome langsung atau hosting sendiri.')}
 if(res.status===401){document.body.classList.add('need-code');setTimeout(openSet,300)}
 if(!res.ok){let t='';try{t=await res.text()}catch(e){}let j='';try{const o=JSON.parse(t);j=(o.error&&(o.error.message||o.error))||o.message||''}catch(e){}
  throw new Error('Error '+res.status+(res.status===401||res.status===403?' (akses ditolak)':res.status===429?' (batas pemakaian)':'')+': '+String(j||t).slice(0,200))}
 await sse(res,d=>{
  if(p.t==='an'){if(d.type==='content_block_delta'&&d.delta&&d.delta.text){out+=d.delta.text;on(out)}}
  else if(p.t==='gm'){const t=((d.candidates||[])[0]||{}).content;if(t&&t.parts){out+=t.parts.map(x=>x.text||'').join('');on(out)}}
  else{const t=((d.choices||[])[0]||{}).delta;if(t&&t.content){out+=t.content;on(out)}}
 });
 return out;
}
// Ambil pesan terbaru saja sampai batas CTX, selalu mulai dari pesan user
function trim(h){
 let n=0,i=h.length;
 while(i>0){const t=tok(h[i-1].content);if(n+t>CTX&&i<h.length)break;n+=t;i--}
 const r=h.slice(i);
 while(r.length>1&&r[0].role!=='user')r.shift();
 return r;
}
async function ask(c){
 await hyd(c);
 const pe=P.find(p=>p.id===c.persona)||P[0];
 const all=c.msgs.slice(0,-1).map(m=>({role:m.r==='u'?'user':'assistant',content:textOf(m),att:m.att}));
 const hist=trim(all);
 if(hist.length<all.length)toast('Pesan lama dipotong agar muat');
 const sys=pe.p;
 const a=c.msgs[c.msgs.length-1];a.e='';busy=true;ctl=new AbortController();setBtn();
 const inTok=hist.reduce((n,m)=>n+tok(m.content),0)+tok(sys);
 try{const t=await call(hist,sys,t=>{a.c=t;patch(a)},ctl.signal);if(t)a.c=t}
 catch(e){if(e&&e.name==='AbortError'){}else if(e&&e.code==='not_granted')a.e='Izin AI belum diberikan. Muat ulang halaman lalu setujui.';else if(e&&e.code==='rate_limited')a.e='Terlalu banyak permintaan. Tunggu sebentar.';else a.e=(e&&e.message)||'Gagal mendapat jawaban.'}

}

  const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);

}

function plain(t){return (t||'').replace(/```[\s\S]*?```/g,' (blok kode) ').replace(/`([^`]*)`/g,'$1').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[*_#>~]+/g,'').replace(/\s+\n/g,'\n').trim()}

 const parts=[];let buf='';
 for(const x of plain(text).split(/(?<=[.!?\n])\s+/)){if(buf&&(buf+' '+x).length>200){parts.push(buf);buf=x}else buf=buf?buf+' '+x:x}

  const u=new SpeechSynthesisUtterance(t);u.lang=S.set.vl||'id-ID';
  if(k===parts.length-1)u.onend=u.onerror=()=>{if(ttsIdx===i){ttsIdx=null;render()}};

$('xpj').onclick=()=>{
 if(!S.chats.length){toast('Belum ada chat untuk diekspor');return}
 const d={app:'novamind',v:2,exported:new Date().toISOString(),chats:S.chats.map(c=>({id:c.id,title:c.title,persona:c.persona,t:c.t,msgs:c.msgs.map(m=>({r:m.r,c:m.c,att:(m.att||[]).map(a=>({k:a.k,n:a.n}))}))}))};
 dl('novamind-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(d));
};
$('ipj').onclick=()=>$('f4').click();
$('f4').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 if(f.size>2e7){toast('File terlalu besar (maks 20 MB)');return}
 try{
  const j=JSON.parse(await f.text());
  const arr=Array.isArray(j)?j:(j&&Array.isArray(j.chats)?j.chats:null);
  if(!arr)throw 0;
  const ids=new Set(S.chats.map(c=>c.id));let add=0,skip=0;
  for(const c of arr){
   if(!c||!Array.isArray(c.msgs)){skip++;continue}
   const msgs=c.msgs.filter(m=>m&&(m.r==='u'||m.r==='a')&&typeof m.c==='string').map(m=>({r:m.r,c:m.c,att:(Array.isArray(m.att)?m.att:[]).filter(a=>a&&a.n).map(a=>({k:a.k,n:String(a.n)}))}));
   const id=typeof c.id==='string'&&c.id?c.id:uid();
   if(!msgs.length||ids.has(id)){skip++;continue}
   ids.add(id);
   S.chats.push({id,title:String(c.title||msgs[0].c).slice(0,60),persona:P.some(p=>p.id===c.persona)?c.persona:'umum',msgs,t:+c.t||Date.now()});add++;
  }
  if(!add&&!skip)throw 0;
  save();render();toast(add+' chat diimpor'+(skip?', '+skip+' dilewati':''));
 }catch(x){toast('File JSON tidak dikenali')}
};
/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let dip=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('pwr').style.display='flex'});
window.addEventListener('appinstalled',()=>{dip=null;$('pwr').style.display='none'});
$('pwa').onclick=async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice}catch(x){}dip=null;$('pwr').style.display='none'};
let ss=null;try{ss=localStorage.getItem(SK)}catch(e){}
if(ss&&getU()[ss])enter(ss);else showAuth();
(async()=>{try{sample=window.claude?await claude.use('sample'):null}catch(e){}
 if(!sample&&S.set.prov==='claude'){S.set.prov='dproxy';save();applySet();render()}})();
</script>
</body>
